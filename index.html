<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <meta name="description"
    content="Secure Bookmark Vault - Organize, save and access your links from anywhere with priority tags and dark mode." />
  <title>Bookmark Vault | Premium Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #60a5fa;
      --secondary: #8b5cf6;
      --secondary-dark: #7c3aed;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg-light: #f0f9ff;
      --bg-dark: #030712;
      --text-light: #0f172a;
      --text-dark: #f3f4f6;
      --card-light: #ffffff;
      --card-dark: #111827;
      --border-light: #e2e8f0;
      --border-dark: #1f2937;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background 0.4s ease, color 0.3s;
      background-color: var(--bg-light);
      color: var(--text-light);
      line-height: 1.5;
    }

    .theme-dark {
      background-color: var(--bg-dark) !important;
      color: var(--text-dark) !important;
    }

    /* Animated gradient background */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: linear-gradient(125deg, #e0f2fe 0%, #fae8ff 50%, #fef3c7 100%);
      transition: 0.4s;
    }

    .theme-dark .animated-bg {
      background: linear-gradient(135deg, #030712 0%, #111827 50%, #0f172a 100%);
    }

    /* Premium Glass Morphism */
    .glass-premium {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .theme-dark .glass-premium {
      background: rgba(17, 24, 39, 0.8);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.4);
    }

    .glass-premium:hover {
      transform: translateY(-3px);
      box-shadow: 0 30px 55px -12px rgba(0, 0, 0, 0.2);
    }

    /* Modern Inputs */
    .input-modern {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      transition: all 0.25s;
      border-radius: 1.25rem;
      padding: 0.9rem 1.2rem;
      font-weight: 500;
    }

    .theme-dark .input-modern {
      background: #1e293b;
      border-color: #334155;
      color: #f1f5f9;
    }

    .input-modern:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.2);
      outline: none;
      transform: scale(1.01);
    }

    /* Premium Button */
    .btn-glow {
      background: linear-gradient(105deg, #3b82f6, #a855f7);
      transition: all 0.3s;
      border: none;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .btn-glow:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px -8px rgba(59, 130, 246, 0.6);
    }

    /* Stats Cards with animation */
    .stat-premium {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(249, 250, 251, 0.9));
      backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      padding: 1rem 0.5rem;
      text-align: center;
      border: 1px solid rgba(59, 130, 246, 0.2);
      transition: all 0.3s;
      cursor: pointer;
    }

    .theme-dark .stat-premium {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border-color: rgba(59, 130, 246, 0.3);
    }

    .stat-premium:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.15);
    }

    .stat-number-glow {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, #3b82f6, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Bookmark Cards 3D effect */
    .bookmark-card-pro {
      background: var(--card-light);
      border-radius: 1.25rem;
      border: 1px solid var(--border-light);
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      margin-bottom: 0.85rem;
      overflow: hidden;
      position: relative;
    }

    .theme-dark .bookmark-card-pro {
      background: var(--card-dark);
      border-color: var(--border-dark);
    }

    .bookmark-card-pro::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.08), transparent);
      transition: left 0.5s;
    }

    .bookmark-card-pro:hover::before {
      left: 100%;
    }

    .bookmark-card-pro:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 25px 35px -15px rgba(0, 0, 0, 0.2);
      border-color: var(--primary-light);
    }

    .favicon-badge {
      width: 52px;
      height: 52px;
      background: linear-gradient(145deg, #3b82f6, #9333ea);
      border-radius: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: white;
      transition: all 0.3s;
    }

    .bookmark-card-pro:hover .favicon-badge {
      transform: scale(1.08) rotate(4deg);
    }

    /* Category Chips Premium */
    .chip-pro {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 1.1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      transition: 0.2s;
    }

    .chip-work {
      background: rgba(59, 130, 246, 0.15);
      color: #2563eb;
      border-left: 3px solid #3b82f6;
    }

    .chip-personal {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
      border-left: 3px solid #10b981;
    }

    .chip-learning {
      background: rgba(139, 92, 246, 0.12);
      color: #7c3aed;
      border-left: 3px solid #8b5cf6;
    }

    .chip-entertainment {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
      border-left: 3px solid #f59e0b;
    }

    .priority-tag {
      font-size: 0.65rem;
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-weight: 700;
      backdrop-filter: blur(4px);
    }

    .priority-high {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .priority-medium {
      background: rgba(245, 158, 11, 0.15);
      color: #f97316;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .priority-low {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* FAB Elegant */
    .fab-elegant {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 68px;
      height: 68px;
      border-radius: 999px;
      background: linear-gradient(145deg, #3b82f6, #8b5cf6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 20px 35px -5px rgba(59, 130, 246, 0.6);
      cursor: pointer;
      z-index: 50;
      transition: all 0.3s;
      border: none;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .fab-elegant:active {
      transform: scale(0.92);
      animation: none;
    }

    @media (hover: hover) {
      .fab-elegant:hover {
        transform: scale(1.1) translateY(-5px);
        box-shadow: 0 28px 40px #3b82f6;
      }
    }

    @media (max-width: 640px) {
      .fab-elegant {
        width: 58px;
        height: 58px;
        bottom: 1.2rem;
        right: 1.2rem;
        font-size: 1.5rem;
      }
    }

    /* Toast Premium */
    .toast-vault {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(24px);
      padding: 1rem 2rem;
      border-radius: 3rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      font-weight: 600;
      box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.3s;
      border-left: 5px solid #10b981;
    }

    .theme-dark .toast-vault {
      background: #1e293b;
      border-color: #334155;
    }

    .toast-vault.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Loading */
    .loader-premium {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: 0.4s;
    }

    .theme-dark .loader-premium {
      background: rgba(3, 7, 18, 0.95);
    }

    .loader-premium.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-ring {
      width: 80px;
      height: 80px;
      border: 5px solid rgba(59, 130, 246, 0.2);
      border-top: 5px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Animations */
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bookmark-card-pro {
      animation: fadeSlideUp 0.35s ease-out;
    }

    @media (max-width: 768px) {
      .glass-premium {
        border-radius: 1.5rem;
      }

      .input-modern {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>

<body class="antialiased overflow-x-hidden theme-light">
  <div class="animated-bg"></div>

  <div id="loaderOverlay" class="loader-premium">
    <div class="loader-ring"></div>
  </div>

  <!-- AUTH MODAL Ultra -->
  <div id="authModal"
    class="fixed inset-0 z-[300] flex items-center justify-center p-5 bg-black/70 backdrop-blur-md transition-all">
    <div class="glass-premium w-full max-w-md p-6 md:p-8 relative animate-fadeSlideUp">
      <div class="text-center mb-6">
        <div
          class="w-24 h-24 mx-auto bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 rounded-3xl flex items-center justify-center text-white text-4xl shadow-2xl mb-4 animate-pulse">
          <i class="fa-solid fa-shield-vault"></i>
        </div>
        <h2
          class="text-3xl font-black tracking-tight bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"
          id="authTitle">Welcome Back</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1" id="authSubtitle">Sign in to your secure vault</p>
      </div>
      <form id="authForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold mb-1.5 ml-1"><i class="fas fa-user-circle mr-1 text-blue-500"></i>
            Username</label>
          <input type="text" id="authUsername" class="input-modern w-full" placeholder="e.g., vault_master" required
            autocomplete="username">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5 ml-1"><i class="fas fa-key mr-1 text-purple-500"></i>
            Password</label>
          <input type="password" id="authPassword" class="input-modern w-full" placeholder="••••••••" required
            autocomplete="current-password">
        </div>
        <button type="submit" class="btn-glow w-full py-3.5 rounded-xl text-white text-lg font-bold transition-all"><i
            class="fas fa-arrow-right-to-bracket mr-2"></i> Access Vault</button>
      </form>
      <div class="mt-6 text-center text-sm">
        <span class="text-gray-500 dark:text-gray-400">New here?</span>
        <button id="switchToSignupBtn"
          class="text-blue-600 dark:text-blue-400 font-semibold ml-2 hover:underline transition">Create account
          →</button>
      </div>
      <div class="mt-3 text-center text-[11px] text-gray-400 flex items-center justify-center gap-2"><i
          class="fas fa-database"></i> Local storage · Private</div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display: none;">
    <div class="container max-w-6xl mx-auto px-5 md:px-6 py-5 md:py-8">
      <!-- Header Premium -->
      <div class="flex flex-wrap justify-between items-center gap-4 mb-10">
        <div class="flex items-center gap-4">
          <div class="favicon-badge !w-14 !h-14 !rounded-2xl shadow-xl"><i class="fa-solid fa-crown"></i></div>
          <div>
            <h1
              class="text-4xl md:text-5xl font-black bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent tracking-tight">
              Bookmark Vault</h1>
            <p class="text-gray-500 dark:text-gray-400 text-xs flex gap-2 items-center mt-1"><i
                class="fas fa-shield-alt text-emerald-500 text-xs"></i> <span id="currentUserSpan">user</span> · Secure
              Vault · Priority Smart</p>
          </div>
        </div>
        <div class="flex gap-3">
          <button id="statsModalBtn"
            class="p-3 rounded-xl bg-white/60 dark:bg-gray-800/60 shadow-md backdrop-blur-sm text-gray-700 dark:text-gray-200 transition-all hover:scale-110"><i
              class="fas fa-chart-line fa-lg"></i></button>
          <button id="themeSwitch"
            class="p-3 rounded-xl bg-white/60 dark:bg-gray-800/60 shadow-md backdrop-blur-sm text-gray-700 dark:text-gray-200 text-xl transition-all hover:scale-110"><i
              class="fas fa-moon"></i></button>
          <button id="logoutBtn"
            class="p-3 rounded-xl bg-rose-100/80 dark:bg-rose-900/40 text-rose-600 shadow-md transition-all hover:scale-110"><i
              class="fas fa-sign-out-alt fa-lg"></i></button>
        </div>
      </div>

      <!-- Stats Row Premium -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-5 mb-10">
        <div class="stat-premium"><i class="fas fa-layer-group text-blue-400 text-xl mb-2 block"></i>
          <div class="stat-number-glow" id="statTotal">0</div>
          <div class="text-[11px] font-bold uppercase tracking-wide">Total saved</div>
        </div>
        <div class="stat-premium"><i class="fas fa-briefcase text-indigo-400 text-xl mb-2 block"></i>
          <div class="stat-number-glow" id="statWork">0</div>
          <div class="text-[11px] font-bold uppercase tracking-wide">Work</div>
        </div>
        <div class="stat-premium"><i class="fas fa-heart text-pink-400 text-xl mb-2 block"></i>
          <div class="stat-number-glow" id="statPersonal">0</div>
          <div class="text-[11px] font-bold uppercase tracking-wide">Personal</div>
        </div>
        <div class="stat-premium"><i class="fas fa-calendar-week text-emerald-400 text-xl mb-2 block"></i>
          <div class="stat-number-glow" id="statRecent">0</div>
          <div class="text-[11px] font-bold uppercase tracking-wide">Fresh week</div>
        </div>
      </div>

      <!-- Add Bookmark Card -->
      <div class="glass-premium p-6 md:p-8 mb-10">
        <div class="flex items-center gap-3 mb-6 border-b border-gray-200/60 dark:border-gray-700 pb-3">
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white shadow-md">
            <i class="fas fa-plus-circle text-xl"></i>
          </div>
          <h2 class="text-2xl font-bold" id="formTitle">✨ New Bookmark</h2>
        </div>
        <form id="bookmarkForm" class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div><input type="text" id="title" placeholder="Title *" class="input-modern w-full"></div>
            <div><input type="url" id="url" placeholder="https:// *" class="input-modern w-full"></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <select id="category" class="input-modern w-full bg-white dark:bg-gray-800 cursor-pointer">
              <option value="personal">📘 Personal</option>
              <option value="work">💼 Work</option>
              <option value="learning">📚 Learning</option>
              <option value="entertainment">🎬 Entertainment</option>
            </select>
            <select id="priority" class="input-modern w-full bg-white dark:bg-gray-800 cursor-pointer">
              <option value="low">🟢 Low</option>
              <option value="medium">🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
            <textarea id="description" rows="1" placeholder="Add notes..."
              class="input-modern w-full resize-none"></textarea>
          </div>
          <input type="hidden" id="editId">
          <div class="flex justify-end gap-3">
            <button type="button" id="cancelFormBtn"
              class="px-5 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl font-medium hidden hover:bg-gray-100 dark:hover:bg-gray-800 transition">Cancel</button>
            <button type="submit"
              class="px-7 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold shadow-lg hover:shadow-xl transition flex items-center gap-2"><i
                class="fas fa-save"></i> Save</button>
          </div>
        </form>
      </div>

      <!-- Filters & Library -->
      <div class="glass-premium p-6 md:p-8">
        <div class="flex flex-col lg:flex-row justify-between lg:items-center gap-5 mb-6">
          <h2 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-archive text-blue-500"></i> My Library
          </h2>
          <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
            <div class="relative"><i
                class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text"
                id="searchField" placeholder="Search title, url..." class="input-modern w-full pl-10 pr-4 py-3 text-sm">
            </div>
            <select id="categoryFilter" class="input-modern py-3 px-4 w-full sm:w-40 text-sm">
              <option value="all">All</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="learning">Learning</option>
              <option value="entertainment">Entertainment</option>
            </select>
            <select id="sortBy" class="input-modern py-3 px-4 w-full sm:w-36 text-sm">
              <option value="date">📅 Newest</option>
              <option value="priority">⭐ Priority</option>
              <option value="title">🔤 A-Z</option>
            </select>
          </div>
        </div>

        <div class="flex flex-wrap gap-2 mb-7 pb-2 border-b border-gray-200/50 dark:border-gray-700">
          <button id="exportBtn"
            class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow transition"><i
              class="fas fa-download mr-1"></i> Export</button>
          <button id="importBtn"
            class="px-4 py-2 bg-violet-600 hover:bg-violet-700 text-white rounded-xl text-xs font-bold shadow transition"><i
              class="fas fa-upload mr-1"></i> Import</button>
          <button id="clearAllBtn"
            class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-bold shadow transition"><i
              class="fas fa-trash-alt mr-1"></i> Clear All</button>
          <button id="sampleBtn"
            class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow transition"><i
              class="fas fa-flask mr-1"></i> Demo</button>
          <input type="file" id="importFile" accept=".json" class="hidden">
        </div>

        <div id="bookmarksContainer" class="space-y-3 min-h-[280px]"></div>
      </div>
    </div>
    <button id="fabAddBtn" class="fab-elegant"><i class="fas fa-plus"></i></button>
  </div>

  <div id="toastMsg" class="toast-vault"><i id="toastIcon" class="fas fa-check-circle text-green-500 text-xl"></i><span
      id="toastText" class="text-sm">Done</span><button id="undoActionBtn"
      class="ml-3 text-blue-600 font-bold hidden">Undo</button></div>
  <div id="statsModal"
    class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[150] hidden">
    <div
      class="bg-white dark:bg-gray-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-gray-200 dark:border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-xl"><i class="fas fa-chart-pie mr-2 text-blue-500"></i>Insights</h3><button
          id="closeModalBtn" class="text-gray-500 text-2xl leading-5 hover:text-gray-700">&times;</button>
      </div>
      <div id="modalStatsContent" class="space-y-2 text-sm"></div>
    </div>
  </div>

  <script src="js/script.js">

  </script>
</body>

</html>
