<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>Bookmark Vault | Smart Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary: #3b82f6;
  --primary-dark: #2563eb;
  --primary-light: #93c5fd;
  --secondary: #8b5cf6;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --bg-light: #f1f5f9;
  --bg-dark: #0f172a;
  --text-light: #0f172a;
  --text-dark: #eef2ff;
  --card-light: #ffffff;
  --card-dark: #1e293b;
  --border-light: #e2e8f0;
  --border-dark: #334155;
}

body {
  font-family: 'Inter', sans-serif;
  transition: background 0.25s ease, color 0.2s;
  background-color: var(--bg-light);
  color: var(--text-light);
  line-height: 1.5;
}

.theme-dark {
  background-color: var(--bg-dark) !important;
  color: var(--text-dark) !important;
}

.card-modern {
  background-color: var(--card-light);
  border-radius: 2rem;
  border: 1px solid rgba(0, 0, 0, 0.05);
  transition: all 0.2s;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.02);
}

.theme-dark .card-modern {
  background-color: var(--card-dark);
  border-color: var(--border-dark);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
}

.stats-glass {
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(139, 92, 246, 0.9));
  backdrop-filter: blur(2px);
  border-radius: 1.8rem;
  padding: 1rem 0.5rem;
  transition: transform 0.15s, box-shadow 0.2s;
  box-shadow: 0 14px 22px -12px rgba(59, 130, 246, 0.35);
}

.stats-glass:active {
  transform: scale(0.96);
}

.bookmark-item-card {
  background-color: var(--card-light);
  border-radius: 1.5rem;
  border: 1px solid var(--border-light);
  transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
  margin-bottom: 0.875rem;
  overflow: hidden;
}

.theme-dark .bookmark-item-card {
  background-color: var(--card-dark);
  border-color: var(--border-dark);
}

.bookmark-item-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.12);
  border-color: var(--primary-light);
}

.icon-fav {
  background: linear-gradient(145deg, #3b82f6, #8b5cf6);
  width: 52px;
  height: 52px;
  border-radius: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  color: white;
  box-shadow: 0 8px 14px rgba(59, 130, 246, 0.3);
  flex-shrink: 0;
}

.category-badge {
  display: inline-flex;
  align-items: center;
  padding: 0.3rem 1rem;
  border-radius: 40px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: capitalize;
  background: rgba(59, 130, 246, 0.1);
  color: #2563eb;
  border: 1px solid rgba(59, 130, 246, 0.2);
}

.theme-dark .category-badge {
  background: rgba(147, 197, 253, 0.12);
  color: #b9d0ff;
}

.badge-work {
  background: rgba(59, 130, 246, 0.18);
  color: #1e4fd9;
}

.badge-personal {
  background: rgba(16, 185, 129, 0.15);
  color: #0b8e5c;
}

.badge-learning {
  background: rgba(139, 92, 246, 0.15);
  color: #6d3bcf;
}

.badge-entertainment {
  background: rgba(245, 158, 11, 0.15);
  color: #c47d0b;
}

.theme-dark .badge-work {
  background: rgba(59, 130, 246, 0.25);
  color: #bfdbfe;
}

.theme-dark .badge-personal {
  background: rgba(16, 185, 129, 0.25);
  color: #a7f3d0;
}

.theme-dark .badge-learning {
  background: rgba(139, 92, 246, 0.25);
  color: #ddd6fe;
}

.theme-dark .badge-entertainment {
  background: rgba(245, 158, 11, 0.25);
  color: #fed7aa;
}

.floating-plus {
  position: fixed;
  bottom: 1.8rem;
  right: 1.8rem;
  width: 60px;
  height: 60px;
  border-radius: 999px;
  background: linear-gradient(145deg, #3b82f6, #7c3aed);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  box-shadow: 0 12px 24px rgba(59, 130, 246, 0.5);
  transition: all 0.2s ease;
  cursor: pointer;
  z-index: 40;
  border: none;
}

.floating-plus:active {
  transform: scale(0.9);
  background: #2563eb;
}

@media (hover: hover) {
  .floating-plus:hover {
    transform: scale(1.07);
    box-shadow: 0 20px 30px #3b82f6;
  }
}

.toast-notice {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(30px);
  background: white;
  backdrop-filter: blur(16px);
  padding: 0.9rem 1.8rem;
  border-radius: 3rem;
  display: flex;
  gap: 0.8rem;
  align-items: center;
  font-weight: 600;
  box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: 0.25s;
  border-left: 5px solid var(--success);
  max-width: 90vw;
}

.theme-dark .toast-notice {
  background: #1e293b;
  border: 1px solid #475569;
  color: #f1f5f9;
}

.toast-notice.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

.loading-pulse {
  position: fixed;
  inset: 0;
  background: rgba(241, 245, 249, 0.85);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  transition: 0.2s;
}

.theme-dark .loading-pulse {
  background: rgba(15, 23, 42, 0.85);
}

.loading-pulse.hide {
  opacity: 0;
  visibility: hidden;
}

.pulse-ring {
  width: 56px;
  height: 56px;
  border: 5px solid #cbd5e1;
  border-top: 5px solid #3b82f6;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

input,
select,
textarea {
  transition: all 0.2s;
  background-color: white;
}

.theme-dark input,
.theme-dark select,
.theme-dark textarea {
  background-color: #0f172a;
  border-color: #334155;
  color: #f1f5f9;
}

input:focus,
select:focus,
textarea:focus,
button:focus {
  outline: 3px solid #3b82f6;
  outline-offset: 3px;
}

.animate-fade {
  animation: gentle 0.3s ease-out;
}

@keyframes gentle {
  0% {
    opacity: 0;
    transform: translateY(12px);
  }

  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 640px) {
  .stats-glass .number {
    font-size: 1.6rem;
  }

  .floating-plus {
    width: 54px;
    height: 54px;
    bottom: 1.2rem;
    right: 1.2rem;
  }

  .card-modern {
    border-radius: 1.5rem;
  }
}
  </style>
</head>

<body class="antialiased overflow-x-hidden theme-light">

  <div id="loader" class="loading-pulse">
    <div class="pulse-ring"></div>
  </div>

  <div class="container max-w-6xl mx-auto px-5 md:px-6 py-6 md:py-8">
    <!-- header -->
    <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
      <div class="flex items-center gap-3">
        <div class="icon-fav shadow-xl"><i class="fa-solid fa-layer-group"></i></div>
        <div>
          <h1
            class="text-3xl md:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
            Bookmark Vault</h1>
          <p class="text-gray-500 dark:text-gray-400 text-xs mt-0.5">Your digital sanctuary · responsive</p>
        </div>
      </div>
      <button id="themeSwitch"
        class="p-3.5 rounded-full bg-white/70 dark:bg-gray-800 shadow-md text-gray-700 dark:text-gray-200 hover:shadow-lg transition-all active:scale-95 text-xl backdrop-blur-sm"><i
          class="fas fa-moon"></i></button>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-10">
      <div class="stats-glass text-white text-center">
        <div class="number text-3xl font-black" id="statTotal">0</div>
        <div class="text-xs font-semibold uppercase tracking-wide">Total</div>
      </div>
      <div class="stats-glass text-white text-center">
        <div class="number text-3xl font-black" id="statWork">0</div>
        <div class="text-xs font-semibold uppercase tracking-wide">Work</div>
      </div>
      <div class="stats-glass text-white text-center">
        <div class="number text-3xl font-black" id="statPersonal">0</div>
        <div class="text-xs font-semibold uppercase tracking-wide">Personal</div>
      </div>
      <div class="stats-glass text-white text-center">
        <div class="number text-3xl font-black" id="statRecent">0</div>
        <div class="text-xs font-semibold uppercase tracking-wide">Last 7d</div>
      </div>
    </div>

    <!-- Form Card -->
    <div class="card-modern p-6 md:p-7 mb-9">
      <div class="flex items-center gap-2 mb-5 border-b pb-3 border-gray-200 dark:border-gray-700">
        <i class="fas fa-plus-circle text-blue-500 text-2xl"></i>
        <h2 class="text-xl md:text-2xl font-bold" id="formTitle">➕ Add new bookmark</h2>
      </div>
      <form id="bookmarkForm" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div><label class="block text-sm font-semibold mb-1.5">Title <span class="text-red-400">*</span></label><input
              type="text" id="title" placeholder="Google Drive" class="w-full p-3.5 border-2 rounded-xl focus:ring-2">
          </div>
          <div><label class="block text-sm font-semibold mb-1.5">URL <span class="text-red-400">*</span></label><input
              type="url" id="url" placeholder="https://" class="w-full p-3.5 border-2 rounded-xl"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div><label class="block text-sm font-semibold mb-1.5">Category</label><select id="category"
              class="w-full p-3.5 border-2 rounded-xl bg-white dark:bg-gray-800">
              <option value="personal">📖 Personal</option>
              <option value="work">💼 Work</option>
              <option value="learning">🎓 Learning</option>
              <option value="entertainment">🎬 Entertainment</option>
            </select></div>
          <div><label class="block text-sm font-semibold mb-1.5">Description (optional)</label><textarea
              id="description" rows="2" class="w-full p-3.5 border-2 rounded-xl resize-none"
              placeholder="Any notes..."></textarea></div>
        </div>
        <input type="hidden" id="editId">
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="cancelFormBtn"
            class="px-6 py-3 border-2 rounded-xl font-semibold hover:bg-gray-100 dark:hover:bg-gray-700 hidden transition-all">Cancel</button>
          <button type="submit" id="submitBtn"
            class="px-7 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold shadow-md hover:shadow-xl transition-all flex items-center gap-2"><i
              class="fas fa-save"></i> <span>Save</span></button>
        </div>
      </form>
    </div>

    <!-- List + Filters card -->
    <div class="card-modern p-6 md:p-7">
      <div class="flex flex-col md:flex-row justify-between md:items-center gap-5 mb-6">
        <h2 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-bookmark text-blue-500"></i> My
          collection</h2>
        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
          <div class="relative flex-1"><i
              class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text"
              id="searchField" placeholder="Search title or url..."
              class="w-full pl-11 pr-4 py-3.5 border-2 rounded-xl"></div>
          <select id="categoryFilter" class="w-full sm:w-44 py-3.5 px-4 border-2 rounded-xl bg-white dark:bg-gray-800">
            <option value="all">📌 All</option>
            <option value="work">💼 Work</option>
            <option value="personal">📖 Personal</option>
            <option value="learning">🎓 Learning</option>
            <option value="entertainment">🎬 Entertainment</option>
          </select>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 mb-7">
        <button id="exportDataBtn"
          class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md flex items-center gap-2 text-sm font-semibold"><i
            class="fas fa-download"></i> Export .json</button>
        <button id="importDataBtn"
          class="px-5 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl shadow-md flex items-center gap-2 text-sm font-semibold"><i
            class="fas fa-upload"></i> Import</button>
        <button id="clearEverythingBtn"
          class="px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white rounded-xl shadow-md flex items-center gap-2 text-sm font-semibold"><i
            class="fas fa-trash-alt"></i> Clear all</button>
        <input type="file" id="importFile" accept=".json" class="hidden">
      </div>

      <div id="bookmarksContainer" class="space-y-3 min-h-[260px]">
        <!-- dynamic list -->
      </div>
    </div>
  </div>

  <button id="fabAddBtn" class="floating-plus" aria-label="quick add"><i class="fas fa-plus"></i></button>
  <div id="toastMsg" class="toast-notice"><i id="toastIcon" class="fas fa-check-circle text-green-500 text-xl"></i><span
      id="toastText">Saved</span><button id="undoActionBtn"
      class="ml-3 text-blue-500 font-bold hidden bg-transparent">Undo</button></div>

  <script src="js/script.js"></script>
</body>

</html>
