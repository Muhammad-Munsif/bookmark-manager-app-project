<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Bookmark Manager — fully responsive</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Tailwind via CDN (lightweight) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter font for better readability on all devices -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

</head>

<body class="theme-light antialiased">
  <div class="container mx-auto px-4 py-5 md:py-8 max-w-6xl">
    <!-- ========== HEADER ========== -->
    <header class="flex flex-wrap justify-between items-center mb-6 gap-3">
      <div class="flex items-center">
        <div class="bookmark-icon mr-3 shadow-md">
          <i class="fas fa-bookmark"></i>
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Bookmark Hub</h1>
          <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm">Your collection, everywhere</p>
        </div>
      </div>
      <button id="themeToggle" aria-label="Switch theme"
        class="theme-toggle p-3.5 rounded-full bg-gray-200/70 dark:bg-gray-700 text-gray-700 dark:text-gray-200 shadow-md hover:shadow-lg transition-all active:scale-95">
        <i class="fas fa-moon text-lg"></i>
      </button>
    </header>

    <!-- ========== STATS (improved mobile grid) ========== -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-5 mb-8 stats-grid">
      <div class="stats-card"><span class="number" id="totalBookmarks">0</span><span class="label">Total</span></div>
      <div class="stats-card"><span class="number" id="workBookmarks">0</span><span class="label">Work</span></div>
      <div class="stats-card"><span class="number" id="personalBookmarks">0</span><span class="label">Personal</span>
      </div>
      <div class="stats-card"><span class="number" id="recentBookmarks">0</span><span class="label">Last 7d</span></div>
    </div>

    <!-- ========== ADD/EDIT FORM – responsive, clean ========== -->
    <div class="card rounded-2xl shadow-xl p-5 md:p-6 mb-8 transition-all">
      <h2 class="text-lg md:text-xl font-semibold mb-4 flex items-center">
        <i class="fas fa-plus-circle mr-2 text-blue-500 text-xl"></i>
        <span id="formHeading">Add new bookmark</span>
      </h2>
      <form id="bookmarkForm" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label for="title" class="block mb-2 text-sm font-medium">Title <span class="text-red-400">*</span></label>
            <input type="text" id="title" autocomplete="off"
              class="w-full p-3.5 border rounded-xl focus:ring-4 focus:ring-blue-200 dark:focus:ring-blue-800 bg-white dark:bg-gray-800 transition-all"
              placeholder="e.g. GitHub" required>
          </div>
          <div>
            <label for="url" class="block mb-2 text-sm font-medium">URL <span class="text-red-400">*</span></label>
            <div class="relative">
              <i class="fas fa-link absolute left-4 top-4 text-gray-400"></i>
              <input type="url" id="url"
                class="w-full p-3.5 pl-11 border rounded-xl focus:ring-4 focus:ring-blue-200 dark:bg-gray-800 transition-all"
                placeholder="https://example.com" required>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label for="category" class="block mb-2 text-sm font-medium">Category</label>
            <select id="category"
              class="w-full p-3.5 border rounded-xl bg-white dark:bg-gray-800 focus:ring-4 appearance-none">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="learning">Learning</option>
              <option value="entertainment">Entertainment</option>
            </select>
          </div>
          <div>
            <label for="description" class="block mb-2 text-sm font-medium">Description (optional)</label>
            <textarea id="description" rows="1"
              class="w-full p-3.5 border rounded-xl resize-none focus:ring-4 dark:bg-gray-800 transition-all"
              placeholder="Short note..."></textarea>
          </div>
        </div>
        <input type="hidden" id="bookmarkId">
        <div class="flex justify-end gap-3 items-center">
          <button type="reset" id="cancelBtn"
            class="px-6 py-3 border border-gray-300 dark:border-gray-600 rounded-xl hidden font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-all active:scale-95">
            <i class="fas fa-times mr-1"></i> Cancel
          </button>
          <button type="submit" id="saveBtn"
            class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white rounded-xl font-medium flex items-center shadow-lg hover:shadow-xl transition-all active:scale-95">
            <i class="fas fa-plus mr-2"></i>
            <span class="inline">Add</span>
          </button>
        </div>
      </form>
    </div>

    <!-- ========== SEARCH & FILTER + BOOKMARK LIST ========== -->
    <div class="card rounded-2xl shadow-xl p-5 md:p-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <h2 class="text-xl font-semibold flex items-center">
          <i class="fas fa-bookmark mr-2 text-blue-500"></i> Your bookmarks
        </h2>
        <div class="flex flex-col xs:flex-row w-full sm:w-auto gap-3">
          <div class="relative flex-1 sm:min-w-[220px]">
            <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Search title or url..."
              class="w-full p-3.5 pl-11 border rounded-xl focus:ring-4 dark:bg-gray-800 transition-all">
          </div>
          <select id="categoryFilter"
            class="p-3.5 border rounded-xl bg-white dark:bg-gray-800 focus:ring-4 appearance-none w-full sm:w-auto">
            <option value="all">All</option>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="learning">Learning</option>
            <option value="entertainment">Entertainment</option>
          </select>
        </div>
      </div>

      <!-- Bookmarks container -->
      <div id="bookmarksList" class="space-y-3 min-h-[200px]">
        <!-- dynamic content + fallback empty state -->
        <div id="emptyState" class="text-center py-12 text-gray-400 flex flex-col items-center">
          <i class="fas fa-bookmark text-6xl mb-4 text-gray-300 dark:text-gray-600"></i>
          <p class="text-lg font-medium">Your bookmarks appear here</p>
          <p class="text-sm mt-1">Add a bookmark using the form above </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating action button (mobile friendly) -->
  <button class="floating-action-btn" id="addBookmarkBtn" aria-label="Add bookmark">
    <i class="fas fa-plus"></i>
  </button>

  <!-- Toast notification container -->
  <div id="toast" class="toast">
    <i class="fas fa-check-circle text-green-500 text-lg"></i>
    <span id="toastMessage">Bookmark saved</span>
  </div>


</body>

</html>
