<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
   
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-300"
  >
    <div class="container mx-auto p-4 max-w-4xl">
      <!-- Header -->
      <header class="flex justify-between items-center mb-8">
        <h1
          class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white flex items-center"
        >
          <i class="fas fa-bookmark mr-2 text-blue-500"></i>
          <span class="hidden sm:inline">Bookmark Manager</span>
          <span class="sm:hidden">Bookmarks</span>
        </h1>
        <button
          id="themeToggle"
          class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 transition-colors duration-300"
          aria-label="Toggle theme"
        >
          <i class="fas fa-moon"></i>
        </button>
      </header>

      <!-- Add Bookmark Form -->
      <div
        class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-4 md:p-6 mb-8 transition-colors duration-300"
      >
        <form id="bookmarkForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="title"
                class="block text-gray-700 dark:text-gray-300 mb-2 font-medium"
                >Title</label
              >
              <input
                type="text"
                id="title"
                class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white transition-colors duration-300"
                placeholder="My Favorite Site"
                required
              />
            </div>
            <div>
              <label
                for="url"
                class="block text-gray-700 dark:text-gray-300 mb-2 font-medium"
                >URL</label
              >
              <div class="relative">
                <input
                  type="url"
                  id="url"
                  class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white pl-10 transition-colors duration-300"
                  placeholder="https://example.com"
                  required
                />
                <i
                  class="fas fa-link absolute left-3 top-3.5 text-gray-400"
                ></i>
              </div>
            </div>
          </div>
          <input type="hidden" id="bookmarkId" />
          <div class="flex justify-end gap-3">
            <button
              type="reset"
              id="cancelBtn"
              class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 transition-colors duration-300 hidden"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="saveBtn"
              class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-all duration-300 flex items-center"
            >
              <i class="fas fa-plus mr-2"></i>
              <span class="hidden sm:inline">Add Bookmark</span>
              <span class="sm:hidden">Add</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Search & Bookmarks -->
      <div
        class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-4 md:p-6 transition-colors duration-300"
      >
        <div
          class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4"
        >
          <h2 class="text-xl font-semibold text-gray-800 dark:text-white">
            Your Bookmarks
          </h2>
          <div class="relative w-full md:w-64">
            <input
              type="text"
              id="searchInput"
              class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white pl-10 transition-colors duration-300"
              placeholder="Search..."
            />
            <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
          </div>
        </div>

        <!-- Bookmarks List -->
        <div id="bookmarksList" class="space-y-3">
          <!-- Bookmarks will be added here dynamically -->
          <div
            class="text-center py-8 text-gray-500 dark:text-gray-400"
            id="emptyState"
          >
            <i
              class="fas fa-bookmark text-4xl mb-3 text-gray-300 dark:text-gray-600"
            ></i>
            <p>No bookmarks yet. Add your first one!</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // DOM Elements
        const bookmarkForm = document.getElementById("bookmarkForm");
        const titleInput = document.getElementById("title");
        const urlInput = document.getElementById("url");
        const bookmarkIdInput = document.getElementById("bookmarkId");
        const cancelBtn = document.getElementById("cancelBtn");
        const saveBtn = document.getElementById("saveBtn");
        const bookmarksList = document.getElementById("bookmarksList");
        const searchInput = document.getElementById("searchInput");
        const emptyState = document.getElementById("emptyState");
        const themeToggle = document.getElementById("themeToggle");

        // State
        let isEditing = false;
        let bookmarks = JSON.parse(localStorage.getItem("bookmarks")) || [];

        // Initialize
        renderBookmarks();
        initTheme();

        // Event Listeners
        bookmarkForm.addEventListener("submit", saveBookmark);
        cancelBtn.addEventListener("click", cancelEdit);
        searchInput.addEventListener("input", filterBookmarks);
        themeToggle.addEventListener("click", toggleTheme);

        // Functions
        function saveBookmark(e) {
          e.preventDefault();

          const title = titleInput.value.trim();
          const url = urlInput.value.trim();
          const id = bookmarkIdInput.value;

          // Validate URL
          if (!isValidUrl(url)) {
            urlInput.classList.add("input-error");
            urlInput.focus();
            return;
          }

          const bookmark = { title, url };

          if (isEditing) {
            // Update existing bookmark
            const index = bookmarks.findIndex((b) => b.id === id);
            if (index !== -1) {
              bookmarks[index] = { ...bookmark, id };
            }
            isEditing = false;
          } else {
            // Add new bookmark
            bookmark.id = Date.now().toString();
            bookmarks.push(bookmark);
          }

          // Save to localStorage and reset form
          localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
          bookmarkForm.reset();
          renderBookmarks();

          // Update UI
          saveBtn.innerHTML =
            '<i class="fas fa-plus mr-2"></i><span class="hidden sm:inline">Add Bookmark</span><span class="sm:hidden">Add</span>';
          cancelBtn.classList.add("hidden");
          urlInput.classList.remove("input-error");
        }

        function renderBookmarks(filter = "") {
          if (bookmarks.length === 0) {
            emptyState.classList.remove("hidden");
            bookmarksList.innerHTML = "";
            bookmarksList.appendChild(emptyState);
            return;
          }

          emptyState.classList.add("hidden");

          let filteredBookmarks = bookmarks;
          if (filter) {
            const searchTerm = filter.toLowerCase();
            filteredBookmarks = bookmarks.filter(
              (bookmark) =>
                bookmark.title.toLowerCase().includes(searchTerm) ||
                bookmark.url.toLowerCase().includes(searchTerm)
            );
          }

          if (filteredBookmarks.length === 0) {
            bookmarksList.innerHTML = `
        <div class="text-center py-8 text-gray-500 dark:text-gray-400">
          <i class="fas fa-search text-4xl mb-3 text-gray-300 dark:text-gray-600"></i>
          <p>No bookmarks found matching "${filter}"</p>
        </div>
      `;
            return;
          }

          bookmarksList.innerHTML = filteredBookmarks
            .map(
              (bookmark) => `
      <div class="bookmark-item bg-gray-50 dark:bg-gray-700 p-4 rounded-lg flex justify-between items-center transition-all duration-300" data-id="${bookmark.id}">
        <div class="bookmark-content flex items-center overflow-hidden flex-1">
          <div class="bg-blue-100 dark:bg-blue-900 p-2 rounded-lg mr-4 flex-shrink-0">
            <i class="fas fa-bookmark text-blue-500 dark:text-blue-300"></i>
          </div>
          <div class="truncate flex-1">
            <a href="${bookmark.url}" target="_blank" class="text-blue-500 hover:underline font-medium block truncate">${bookmark.title}</a>
            <span class="text-gray-500 dark:text-gray-400 text-sm block truncate">${bookmark.url}</span>
          </div>
        </div>
        <div class="bookmark-actions flex gap-2 ml-4">
          <button class="edit-btn p-2 text-blue-500 hover:bg-blue-100 dark:hover:bg-gray-600 rounded-lg transition-colors duration-300" aria-label="Edit bookmark">
            <i class="fas fa-edit"></i>
          </button>
          <button class="delete-btn p-2 text-red-500 hover:bg-red-100 dark:hover:bg-gray-600 rounded-lg transition-colors duration-300" aria-label="Delete bookmark">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </div>
    `
            )
            .join("");

          // Add event listeners to edit and delete buttons
          document.querySelectorAll(".edit-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const bookmarkId = e.target.closest(".bookmark-item").dataset.id;
              editBookmark(bookmarkId);
            });
          });

          document.querySelectorAll(".delete-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const bookmarkId = e.target.closest(".bookmark-item").dataset.id;
              deleteBookmark(bookmarkId);
            });
          });
        }

        function editBookmark(id) {
          const bookmark = bookmarks.find((b) => b.id === id);
          if (!bookmark) return;

          titleInput.value = bookmark.title;
          urlInput.value = bookmark.url;
          bookmarkIdInput.value = bookmark.id;

          // Update UI for editing
          isEditing = true;
          saveBtn.innerHTML =
            '<i class="fas fa-save mr-2"></i><span class="hidden sm:inline">Save Changes</span><span class="sm:hidden">Save</span>';
          cancelBtn.classList.remove("hidden");
          titleInput.focus();
        }

        function deleteBookmark(id) {
          if (confirm("Are you sure you want to delete this bookmark?")) {
            bookmarks = bookmarks.filter((bookmark) => bookmark.id !== id);
            localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
            renderBookmarks();
          }
        }

        function cancelEdit() {
          bookmarkForm.reset();
          isEditing = false;
          saveBtn.innerHTML =
            '<i class="fas fa-plus mr-2"></i><span class="hidden sm:inline">Add Bookmark</span><span class="sm:hidden">Add</span>';
          cancelBtn.classList.add("hidden");
        }

        function filterBookmarks() {
          renderBookmarks(searchInput.value.trim());
        }

        function isValidUrl(url) {
          try {
            new URL(url);
            return true;
          } catch {
            return false;
          }
        }

        // Theme functions
        function toggleTheme() {
          document.body.classList.toggle("dark");

          const icon = themeToggle.querySelector("i");
          if (document.body.classList.contains("dark")) {
            icon.classList.remove("fa-sun");
            icon.classList.add("fa-moon");
            localStorage.setItem("theme", "dark");
          } else {
            icon.classList.remove("fa-moon");
            icon.classList.add("fa-sun");
            localStorage.setItem("theme", "light");
          }
        }

        function initTheme() {
          const savedTheme = localStorage.getItem("theme") || "light";
          if (savedTheme === "dark") {
            document.body.classList.add("dark");
          }

          const icon = themeToggle.querySelector("i");
          if (savedTheme === "dark") {
            icon.classList.add("fa-moon");
            icon.classList.remove("fa-sun");
          } else {
            icon.classList.add("fa-sun");
            icon.classList.remove("fa-moon");
          }
        }
      });
    </script>
  </body>
</html>
