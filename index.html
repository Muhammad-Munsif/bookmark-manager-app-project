<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Bookmark Manager — fully responsive</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Tailwind via CDN (lightweight) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Inter font for better readability on all devices -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ----- GLOBAL DESIGN SYSTEM – optimized for ALL devices, improved touch targets, animations, micro-interactions ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #93c5fd;
      --secondary: #8b5cf6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg-light: #f8fafc;
      --bg-dark: #0f172a;
      --text-light: #1e293b;
      --text-dark: #f1f5f9;
      --card-light: #ffffff;
      --card-dark: #1e293b;
      --border-light: #e2e8f0;
      --border-dark: #334155;
      --gradient-start: #3b82f6;
      --gradient-end: #8b5cf6;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
      background-color: var(--bg-light);
      color: var(--text-light);
      min-height: 100vh;
      font-size: 16px;
      /* base for rem, better mobile readability */
    }

    /* theme classes */
    .theme-dark {
      background-color: var(--bg-dark) !important;
      color: var(--text-dark) !important;
    }

    .theme-light {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    /* cards & containers – adapt to dark/light */
    .card {
      background-color: var(--card-light);
      border: 1px solid var(--border-light);
      transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .theme-dark .card {
      background-color: var(--card-dark);
      border-color: var(--border-dark);
    }

    .theme-dark select,
    .theme-dark input,
    .theme-dark textarea,
    .theme-dark .category-filter-el {
      background-color: #1e293b;
      border-color: #334155;
      color: #f1f5f9;
    }

    .theme-dark option {
      background-color: #1e293b;
      color: #f1f5f9;
    }

    /* bookmark item – enhanced touch feedback */
    .bookmark-item {
      transition: all 0.2s ease;
      border-bottom: 1px solid var(--border-light);
      border-radius: 12px;
      margin-bottom: 8px;
      background-color: var(--card-light);
    }

    .theme-dark .bookmark-item {
      border-bottom-color: var(--border-dark);
      background-color: var(--card-dark);
    }

    .bookmark-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.15);
    }

    /* active state for mobile tap */
    .bookmark-item:active {
      background-color: rgba(59, 130, 246, 0.05);
    }

    /* bookmark icon – consistent gradient */
    .bookmark-icon {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      width: 48px;
      height: 48px;
      color: white;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    /* category tags – responsive, improved contrast */
    .category-tag {
      display: inline-block;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: capitalize;
      margin-right: 0.5rem;
      margin-bottom: 0.25rem;
      background: rgba(59, 130, 246, 0.08);
      color: #2563eb;
    }

    .theme-dark .category-tag {
      background: rgba(147, 197, 253, 0.15);
      color: #93c5fd;
    }

    .category-work {
      background: rgba(59, 130, 246, 0.12);
      color: #1e4fd9;
    }

    .category-personal {
      background: rgba(16, 185, 129, 0.12);
      color: #0b8e5c;
    }

    .category-learning {
      background: rgba(139, 92, 246, 0.12);
      color: #6d3bcf;
    }

    .category-entertainment {
      background: rgba(245, 158, 11, 0.12);
      color: #c47d0b;
    }

    .theme-dark .category-work {
      background: rgba(59, 130, 246, 0.25);
      color: #bfdbfe;
    }

    .theme-dark .category-personal {
      background: rgba(16, 185, 129, 0.25);
      color: #a7f3d0;
    }

    .theme-dark .category-learning {
      background: rgba(139, 92, 246, 0.25);
      color: #ddd6fe;
    }

    .theme-dark .category-entertainment {
      background: rgba(245, 158, 11, 0.25);
      color: #fed7aa;
    }

    /* stats cards – soft gradient, perfect on all screens */
    .stats-card {
      background: linear-gradient(145deg, #3b82f6, #8b5cf6);
      color: white;
      border-radius: 20px;
      padding: 1.2rem 0.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 10px 20px -8px rgba(59, 130, 246, 0.3);
      transition: transform 0.2s;
    }

    .stats-card:active {
      transform: scale(0.98);
    }

    .stats-card .number {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .stats-card .label {
      font-size: 0.8rem;
      opacity: 0.95;
      font-weight: 500;
    }

    /* floating action button – perfect for mobile, bigger hit area */
    .floating-action-btn {
      position: fixed;
      bottom: clamp(1rem, 4vw, 2rem);
      right: clamp(1rem, 4vw, 2rem);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(145deg, #3b82f6, #8b5cf6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      border: none;
      z-index: 50;
    }

    .floating-action-btn:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .floating-action-btn:active {
      transform: scale(0.9);
      background: linear-gradient(145deg, #2563eb, #7c3aed);
    }

    /* toast – fully responsive, centered */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      background: white;
      color: #1e293b;
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.2);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, transform 0.25s, visibility 0.25s;
      font-weight: 500;
      border-left: 5px solid var(--success);
      max-width: 90vw;
      word-break: break-word;
    }

    .theme-dark .toast {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #475569;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      visibility: visible;
    }

    .toast.success {
      border-left-color: #10b981;
    }

    .toast.error {
      border-left-color: #ef4444;
    }

    .toast.info {
      border-left-color: #3b82f6;
    }

    /* empty state illustrations */
    .empty-illustration {
      opacity: 0.7;
    }

    /* 100% responsive grid fixes */
    @media (max-width: 480px) {
      .container {
        padding-left: 1rem;
        padding-right: 1rem;
      }

      .bookmark-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .bookmark-actions {
        align-self: flex-end;
        margin-top: 0.5rem;
      }

      .stats-card .number {
        font-size: 1.6rem;
      }

      .floating-action-btn {
        width: 58px;
        height: 58px;
        font-size: 1.6rem;
      }
    }

    @media (max-width: 380px) {
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .stats-card {
        padding: 0.8rem 0.2rem;
      }
    }

    /* improved focus rings for accessibility */
    input:focus,
    select:focus,
    textarea:focus,
    button:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    .theme-dark input:focus,
    .theme-dark select:focus,
    .theme-dark textarea:focus {
      outline-color: #93c5fd;
    }

    /* animation for new items */
    @keyframes fadeSlide {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeSlide 0.3s ease-out;
    }

    /* category filter – responsive width */
    #categoryFilter,
    #searchInput {
      min-height: 48px;
      /* better touch */
    }
  </style>
</head>

<body class="theme-light antialiased">
  <div class="container mx-auto px-4 py-5 md:py-8 max-w-6xl">
    <!-- ========== HEADER ========== -->
    <header class="flex flex-wrap justify-between items-center mb-6 gap-3">
      <div class="flex items-center">
        <div class="bookmark-icon mr-3 shadow-md">
          <i class="fas fa-bookmark"></i>
        </div>
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Bookmark Hub</h1>
          <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm">Your collection, everywhere</p>
        </div>
      </div>
      <button id="themeToggle" aria-label="Switch theme"
        class="theme-toggle p-3.5 rounded-full bg-gray-200/70 dark:bg-gray-700 text-gray-700 dark:text-gray-200 shadow-md hover:shadow-lg transition-all active:scale-95">
        <i class="fas fa-moon text-lg"></i>
      </button>
    </header>

    <!-- ========== STATS (improved mobile grid) ========== -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-5 mb-8 stats-grid">
      <div class="stats-card"><span class="number" id="totalBookmarks">0</span><span class="label">Total</span></div>
      <div class="stats-card"><span class="number" id="workBookmarks">0</span><span class="label">Work</span></div>
      <div class="stats-card"><span class="number" id="personalBookmarks">0</span><span class="label">Personal</span>
      </div>
      <div class="stats-card"><span class="number" id="recentBookmarks">0</span><span class="label">Last 7d</span></div>
    </div>

    <!-- ========== ADD/EDIT FORM – responsive, clean ========== -->
    <div class="card rounded-2xl shadow-xl p-5 md:p-6 mb-8 transition-all">
      <h2 class="text-lg md:text-xl font-semibold mb-4 flex items-center">
        <i class="fas fa-plus-circle mr-2 text-blue-500 text-xl"></i>
        <span id="formHeading">Add new bookmark</span>
      </h2>
      <form id="bookmarkForm" class="space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label for="title" class="block mb-2 text-sm font-medium">Title <span class="text-red-400">*</span></label>
            <input type="text" id="title" autocomplete="off"
              class="w-full p-3.5 border rounded-xl focus:ring-4 focus:ring-blue-200 dark:focus:ring-blue-800 bg-white dark:bg-gray-800 transition-all"
              placeholder="e.g. GitHub" required>
          </div>
          <div>
            <label for="url" class="block mb-2 text-sm font-medium">URL <span class="text-red-400">*</span></label>
            <div class="relative">
              <i class="fas fa-link absolute left-4 top-4 text-gray-400"></i>
              <input type="url" id="url"
                class="w-full p-3.5 pl-11 border rounded-xl focus:ring-4 focus:ring-blue-200 dark:bg-gray-800 transition-all"
                placeholder="https://example.com" required>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label for="category" class="block mb-2 text-sm font-medium">Category</label>
            <select id="category"
              class="w-full p-3.5 border rounded-xl bg-white dark:bg-gray-800 focus:ring-4 appearance-none">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="learning">Learning</option>
              <option value="entertainment">Entertainment</option>
            </select>
          </div>
          <div>
            <label for="description" class="block mb-2 text-sm font-medium">Description (optional)</label>
            <textarea id="description" rows="1"
              class="w-full p-3.5 border rounded-xl resize-none focus:ring-4 dark:bg-gray-800 transition-all"
              placeholder="Short note..."></textarea>
          </div>
        </div>
        <input type="hidden" id="bookmarkId">
        <div class="flex justify-end gap-3 items-center">
          <button type="reset" id="cancelBtn"
            class="px-6 py-3 border border-gray-300 dark:border-gray-600 rounded-xl hidden font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition-all active:scale-95">
            <i class="fas fa-times mr-1"></i> Cancel
          </button>
          <button type="submit" id="saveBtn"
            class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white rounded-xl font-medium flex items-center shadow-lg hover:shadow-xl transition-all active:scale-95">
            <i class="fas fa-plus mr-2"></i>
            <span class="inline">Add</span>
          </button>
        </div>
      </form>
    </div>

    <!-- ========== SEARCH & FILTER + BOOKMARK LIST ========== -->
    <div class="card rounded-2xl shadow-xl p-5 md:p-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
        <h2 class="text-xl font-semibold flex items-center">
          <i class="fas fa-bookmark mr-2 text-blue-500"></i> Your bookmarks
        </h2>
        <div class="flex flex-col xs:flex-row w-full sm:w-auto gap-3">
          <div class="relative flex-1 sm:min-w-[220px]">
            <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Search title or url..."
              class="w-full p-3.5 pl-11 border rounded-xl focus:ring-4 dark:bg-gray-800 transition-all">
          </div>
          <select id="categoryFilter"
            class="p-3.5 border rounded-xl bg-white dark:bg-gray-800 focus:ring-4 appearance-none w-full sm:w-auto">
            <option value="all">All</option>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="learning">Learning</option>
            <option value="entertainment">Entertainment</option>
          </select>
        </div>
      </div>

      <!-- Bookmarks container -->
      <div id="bookmarksList" class="space-y-3 min-h-[200px]">
        <!-- dynamic content + fallback empty state -->
        <div id="emptyState" class="text-center py-12 text-gray-400 flex flex-col items-center">
          <i class="fas fa-bookmark text-6xl mb-4 text-gray-300 dark:text-gray-600"></i>
          <p class="text-lg font-medium">Your bookmarks appear here</p>
          <p class="text-sm mt-1">Add a bookmark using the form above </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating action button (mobile friendly) -->
  <button class="floating-action-btn" id="addBookmarkBtn" aria-label="Add bookmark">
    <i class="fas fa-plus"></i>
  </button>

  <!-- Toast notification container -->
  <div id="toast" class="toast">
    <i class="fas fa-check-circle text-green-500 text-lg"></i>
    <span id="toastMessage">Bookmark saved</span>
  </div>
  <script src="js/script.js">
    
(function () {
  "use strict";

  // ========== DOM ELEMENTS ==========
  const body = document.body;
  const themeToggle = document.getElementById('themeToggle');
  const bookmarkForm = document.getElementById('bookmarkForm');
  const titleInput = document.getElementById('title');
  const urlInput = document.getElementById('url');
  const categoryInput = document.getElementById('category');
  const descriptionInput = document.getElementById('description');
  const bookmarkIdInput = document.getElementById('bookmarkId');
  const cancelBtn = document.getElementById('cancelBtn');
  const saveBtn = document.getElementById('saveBtn');
  const bookmarksList = document.getElementById('bookmarksList');
  const searchInput = document.getElementById('searchInput');
  const categoryFilter = document.getElementById('categoryFilter');
  const emptyState = document.getElementById('emptyState');
  const addBookmarkBtn = document.getElementById('addBookmarkBtn');
  const toast = document.getElementById('toast');
  const toastMessage = document.getElementById('toastMessage');
  const formHeading = document.getElementById('formHeading');

  // stats spans
  const totalEl = document.getElementById('totalBookmarks');
  const workEl = document.getElementById('workBookmarks');
  const personalEl = document.getElementById('personalBookmarks');
  const recentEl = document.getElementById('recentBookmarks');

  // ========== STATE ==========
  let bookmarks = [];
  let isEditing = false;

  // ---------- Load from localStorage ----------
  function loadBookmarks() {
    try {
      const stored = localStorage.getItem('bm_responsive');
      bookmarks = stored ? JSON.parse(stored) : [];
      // assign ids if missing (legacy)
      bookmarks = bookmarks.map(b => {
        if (!b.id) b.id = Date.now() + Math.random().toString(36);
        if (!b.createdAt) b.createdAt = new Date().toISOString();
        return b;
      });
    } catch (e) {
      bookmarks = [];
    }
  }

  // ---------- Save to localStorage ----------
  function saveToStorage() {
    localStorage.setItem('bm_responsive', JSON.stringify(bookmarks));
  }

  // ---------- THEME ----------
  function initTheme() {
    const stored = localStorage.getItem('theme_responsive') || 'light';
    if (stored === 'dark') {
      body.classList.remove('theme-light');
      body.classList.add('theme-dark');
      themeToggle.innerHTML = '<i class="fas fa-sun text-lg"></i>';
    } else {
      body.classList.remove('theme-dark');
      body.classList.add('theme-light');
      themeToggle.innerHTML = '<i class="fas fa-moon text-lg"></i>';
    }
  }
  function toggleTheme() {
    if (body.classList.contains('theme-light')) {
      body.classList.replace('theme-light', 'theme-dark');
      themeToggle.innerHTML = '<i class="fas fa-sun text-lg"></i>';
      localStorage.setItem('theme_responsive', 'dark');
    } else {
      body.classList.replace('theme-dark', 'theme-light');
      themeToggle.innerHTML = '<i class="fas fa-moon text-lg"></i>';
      localStorage.setItem('theme_responsive', 'light');
    }
  }

  // ---------- VALIDATE URL ----------
  function isValidUrl(str) {
    try { new URL(str); return true; }
    catch { return false; }
  }

  // ---------- SHOW TOAST ----------
  function showToast(msg, type = 'success') {
    toastMessage.textContent = msg;
    toast.className = 'toast';
    toast.classList.add(type, 'show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ---------- RENDER BOOKMARKS (search + filter + sort) ----------
  function renderBookmarks() {
    const searchTerm = searchInput.value.trim().toLowerCase();
    const catFilter = categoryFilter.value;

    // filter by search & category
    let filtered = bookmarks.filter(b => {
      const matchSearch = searchTerm === '' ||
        b.title.toLowerCase().includes(searchTerm) ||
        b.url.toLowerCase().includes(searchTerm) ||
        (b.description && b.description.toLowerCase().includes(searchTerm));
      const matchCat = catFilter === 'all' || b.category === catFilter;
      return matchSearch && matchCat;
    });

    // sort newest first
    filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    // update stats always
    updateStats();

    // handle empty states
    if (filtered.length === 0) {
      if (bookmarks.length === 0) {
        // show original empty state
        emptyState.classList.remove('hidden');
        bookmarksList.innerHTML = '';
        bookmarksList.appendChild(emptyState);
      } else {
        // no results after filter
        bookmarksList.innerHTML = `
              <div class="text-center py-16 text-gray-500 flex flex-col items-center">
                <i class="fas fa-filter text-5xl mb-3 opacity-40"></i>
                <p class="text-lg font-medium">No matching bookmarks</p>
                <p class="text-sm mt-1">Try a different search or category</p>
              </div>`;
      }
      return;
    }

    emptyState.classList.add('hidden');

    // generate HTML
    let html = '';
    filtered.forEach(bm => {
      const catClass = `category-tag category-${bm.category}`;
      const catDisplay = bm.category ? bm.category.charAt(0).toUpperCase() + bm.category.slice(1) : 'Personal';
      const descHtml = bm.description ? `<p class="text-gray-600 dark:text-gray-300 text-sm mt-1.5 line-clamp-2">${escapeHTML(bm.description)}</p>` : '';

      html += `
            <div class="bookmark-item p-4 flex flex-wrap md:flex-nowrap justify-between items-start fade-in relative" data-id="${bm.id}">
              <div class="flex items-start overflow-hidden flex-1 min-w-0">
                <div class="bookmark-icon mr-4 shadow-sm">
                  <i class="fas fa-bookmark"></i>
                </div>
                <div class="truncate flex-1 pr-2">
                  <a href="${bm.url}" target="_blank" rel="noopener" class="text-blue-600 dark:text-blue-400 hover:underline font-semibold block truncate text-base">${escapeHTML(bm.title)}</a>
                  <span class="text-gray-500 dark:text-gray-400 text-sm block truncate">${escapeHTML(bm.url)}</span>
                  ${descHtml}
                  <div class="mt-2 flex flex-wrap">
                    <span class="${catClass}">${catDisplay}</span>
                  </div>
                </div>
              </div>
              <div class="bookmark-actions flex gap-1 ml-0 md:ml-2 mt-2 md:mt-0 w-full md:w-auto justify-end">
                <button class="edit-btn p-3 text-blue-600 hover:bg-blue-100 dark:hover:bg-gray-700 rounded-xl transition-all active:bg-blue-200" title="Edit">
                  <i class="fas fa-edit text-lg"></i>
                </button>
                <button class="delete-btn p-3 text-red-500 hover:bg-red-100 dark:hover:bg-gray-700 rounded-xl transition-all active:bg-red-200" title="Delete">
                  <i class="fas fa-trash-alt text-lg"></i>
                </button>
              </div>
            </div>`;
    });

    bookmarksList.innerHTML = html;

    // attach listeners
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const item = e.target.closest('.bookmark-item');
        if (item?.dataset.id) editBookmark(item.dataset.id);
      });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const item = e.target.closest('.bookmark-item');
        if (item?.dataset.id) deleteBookmark(item.dataset.id);
      });
    });
  }

  // tiny escape
  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"]/g, function (c) {
      if (c === '&') return '&amp;';
      if (c === '<') return '&lt;';
      if (c === '>') return '&gt;';
      if (c === '"') return '&quot;';
      return c;
    });
  }

  // ---------- SAVE (add / update) ----------
  function saveBookmark(e) {
    e.preventDefault();
    const title = titleInput.value.trim();
    const url = urlInput.value.trim();
    const category = categoryInput.value;
    const description = descriptionInput.value.trim();
    const id = bookmarkIdInput.value;

    if (!title || !url) {
      showToast('Title and URL are required', 'error');
      return;
    }
    if (!isValidUrl(url)) {
      urlInput.classList.add('border-red-500', 'ring-red-200');
      showToast('Please enter a valid URL (include https://)', 'error');
      urlInput.focus();
      return;
    }
    urlInput.classList.remove('border-red-500', 'ring-red-200');

    if (isEditing && id) {
      // update
      const index = bookmarks.findIndex(b => b.id === id);
      if (index > -1) {
        bookmarks[index] = { ...bookmarks[index], title, url, category, description };
      }
      showToast('Bookmark updated', 'success');
      isEditing = false;
      formHeading.innerText = 'Add new bookmark';
      saveBtn.innerHTML = '<i class="fas fa-plus mr-2"></i> <span>Add</span>';
      cancelBtn.classList.add('hidden');
    } else {
      // create new
      const newBm = {
        id: Date.now().toString() + '-' + Math.random().toString(36).substring(2, 6),
        title,
        url,
        category,
        description: description || '',
        createdAt: new Date().toISOString()
      };
      bookmarks.push(newBm);
      showToast('Bookmark added', 'success');
    }

    saveToStorage();
    bookmarkForm.reset();
    bookmarkIdInput.value = '';
    renderBookmarks();
    urlInput.classList.remove('border-red-500');
  }

  // ---------- EDIT ----------
  function editBookmark(id) {
    const bm = bookmarks.find(b => b.id === id);
    if (!bm) return;
    titleInput.value = bm.title;
    urlInput.value = bm.url;
    categoryInput.value = bm.category || 'personal';
    descriptionInput.value = bm.description || '';
    bookmarkIdInput.value = bm.id;

    isEditing = true;
    formHeading.innerText = '✏️ Edit bookmark';
    saveBtn.innerHTML = '<i class="fas fa-save mr-2"></i> <span>Save changes</span>';
    cancelBtn.classList.remove('hidden');
    // scroll to form smoothly
    document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'center' });
    titleInput.focus();
  }

  // ---------- DELETE ----------
  function deleteBookmark(id) {
    if (window.confirm('Delete this bookmark?')) {
      bookmarks = bookmarks.filter(b => b.id !== id);
      saveToStorage();
      renderBookmarks();
      showToast('Bookmark deleted', 'info');
      // if no bookmarks, ensure empty state
    }
  }

  // ---------- CANCEL EDIT ----------
  function cancelEdit() {
    bookmarkForm.reset();
    isEditing = false;
    bookmarkIdInput.value = '';
    formHeading.innerText = 'Add new bookmark';
    saveBtn.innerHTML = '<i class="fas fa-plus mr-2"></i> <span>Add</span>';
    cancelBtn.classList.add('hidden');
    urlInput.classList.remove('border-red-500');
  }

  // ---------- STATS ----------
  function updateStats() {
    const total = bookmarks.length;
    const work = bookmarks.filter(b => b.category === 'work').length;
    const personal = bookmarks.filter(b => b.category === 'personal').length;
    const weekAgo = new Date();
    weekAgo.setDate(weekAgo.getDate() - 7);
    const recent = bookmarks.filter(b => new Date(b.createdAt) >= weekAgo).length;

    totalEl.textContent = total;
    workEl.textContent = work;
    personalEl.textContent = personal;
    recentEl.textContent = recent;
  }

  // ---------- SCROLL TO FORM (FAB) ----------
  function scrollToForm() {
    document.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'center' });
    titleInput.focus();
  }

  // ---------- FILTER LISTENER ----------
  function filterHandler() { renderBookmarks(); }

  // ---------- INITIALIZATION ----------
  function init() {
    loadBookmarks();
    initTheme();
    renderBookmarks();
    // event listeners
    themeToggle.addEventListener('click', toggleTheme);
    bookmarkForm.addEventListener('submit', saveBookmark);
    cancelBtn.addEventListener('click', cancelEdit);
    searchInput.addEventListener('input', filterHandler);
    categoryFilter.addEventListener('change', filterHandler);
    addBookmarkBtn.addEventListener('click', scrollToForm);
    // reset on reset click but handle cancel button state
    bookmarkForm.addEventListener('reset', function (e) {
      setTimeout(() => {
        if (!isEditing) {
          cancelBtn.classList.add('hidden');
          saveBtn.innerHTML = '<i class="fas fa-plus mr-2"></i> <span>Add</span>';
          formHeading.innerText = 'Add new bookmark';
          bookmarkIdInput.value = '';
        }
      }, 10);
    });
    // small fix: if url field gets focus remove error style
    urlInput.addEventListener('focus', () => urlInput.classList.remove('border-red-500'));
  }

  init();
})();

  </script>

</body>
