<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-light: #f8fafc;
            --bg-dark: #0f172a;
            --text-light: #1e293b;
            --text-dark: #f1f5f9;
            --card-light: #ffffff;
            --card-dark: #1e293b;
            --border-light: #e2e8f0;
            --border-dark: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .theme-light {
            --bg-color: var(--bg-light);
            --text-color: var(--text-light);
            --card-color: var(--card-light);
            --border-color: var(--border-light);
        }

        .theme-dark {
            --bg-color: var(--bg-dark);
            --text-color: var(--text-dark);
            --card-color: var(--card-dark);
            --border-color: var(--border-dark);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
        }

        .bookmark-item {
            transition: all 0.3s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .bookmark-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .theme-toggle {
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: rotate(12deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .bookmark-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .bookmark-actions {
                margin-top: 0.75rem;
                align-self: flex-end;
            }
        }
    </style>
</head>
<body class="theme-light min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl md:text-3xl font-bold flex items-center">
                <i class="fas fa-bookmark mr-3 text-blue-500"></i>
                <span class="hidden sm:inline">Bookmark Manager</span>
                <span class="sm:hidden">Bookmarks</span>
            </h1>
            <button id="themeToggle" class="theme-toggle p-3 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 shadow-md">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <!-- Add Bookmark Form -->
        <div class="card rounded-xl shadow-lg p-6 mb-8">
            <form id="bookmarkForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="title" class="block mb-2 font-medium">Title</label>
                        <input type="text" id="title" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white" placeholder="My Favorite Website" required>
                    </div>
                    <div>
                        <label for="url" class="block mb-2 font-medium">URL</label>
                        <div class="relative">
                            <input type="url" id="url" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white pl-10" placeholder="https://example.com" required>
                            <i class="fas fa-link absolute left-3 top-3.5 text-gray-400"></i>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="bookmarkId">
                <div class="flex justify-end gap-3">
                    <button type="reset" id="cancelBtn" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hidden">Cancel</button>
                    <button type="submit" id="saveBtn" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition flex items-center">
                        <i class="fas fa-plus mr-2"></i>
                        <span class="hidden sm:inline">Add Bookmark</span>
                        <span class="sm:hidden">Add</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Search & Bookmarks -->
        <div class="card rounded-xl shadow-lg p-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-semibold">Your Bookmarks</h2>
                <div class="relative w-full md:w-64">
                    <input type="text" id="searchInput" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-800 dark:text-white pl-10" placeholder="Search bookmarks...">
                    <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
                </div>
            </div>

            <!-- Bookmarks List -->
            <div id="bookmarksList" class="space-y-4">
                <!-- Bookmarks will be added here dynamically -->
                <div class="text-center py-12 text-gray-500" id="emptyState">
                    <i class="fas fa-bookmark text-5xl mb-4 text-gray-300"></i>
                    <p class="text-lg">No bookmarks yet. Add your first one!</p>
                </div>
            </div>
        </div>
    </div>


</body>
</html>
