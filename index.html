<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>Bookmark Vault | Ultra Edition</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #60a5fa;
      --secondary: #8b5cf6;
      --secondary-dark: #7c3aed;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #06b6d4;
      --bg-light: #f0f4f8;
      --bg-dark: #0a0f1c;
      --text-light: #0f172a;
      --text-dark: #eef2ff;
      --card-light: #ffffff;
      --card-dark: #111827;
      --border-light: #e2e8f0;
      --border-dark: #1f2937;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), color 0.2s;
      background-color: var(--bg-light);
      color: var(--text-light);
      line-height: 1.5;
    }

    .theme-dark {
      background-color: var(--bg-dark) !important;
      color: var(--text-dark) !important;
    }

    /* Glass morphism card */
    .card-glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
    }

    .theme-dark .card-glass {
      background: rgba(17, 24, 39, 0.75);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .card-glass:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.15);
    }

    /* Animated stats cards */
    .stat-card {
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      border-radius: 1.8rem;
      padding: 1rem 0.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(59, 130, 246, 0.2);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .theme-dark .stat-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.2), transparent);
      transition: left 0.5s;
    }

    .stat-card:hover::before {
      left: 100%;
    }

    .stat-number {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .theme-dark .stat-number {
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* Bookmark card with hover effects */
    .bookmark-card {
      background: var(--card-light);
      border-radius: 1.5rem;
      border: 1px solid var(--border-light);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      margin-bottom: 0.875rem;
      position: relative;
      overflow: hidden;
    }

    .theme-dark .bookmark-card {
      background: var(--card-dark);
      border-color: var(--border-dark);
    }

    .bookmark-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.2);
      border-color: var(--primary-light);
    }

    .bookmark-favicon {
      width: 48px;
      height: 48px;
      background: linear-gradient(145deg, #3b82f6, #8b5cf6);
      border-radius: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: white;
      transition: transform 0.2s;
    }

    .bookmark-card:hover .bookmark-favicon {
      transform: scale(1.05) rotate(3deg);
    }

    /* Category chips */
    .chip-category {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }

    .chip-work { background: rgba(59, 130, 246, 0.15); color: #2563eb; border-left: 3px solid #3b82f6; }
    .chip-personal { background: rgba(16, 185, 129, 0.12); color: #059669; border-left: 3px solid #10b981; }
    .chip-learning { background: rgba(139, 92, 246, 0.12); color: #7c3aed; border-left: 3px solid #8b5cf6; }
    .chip-entertainment { background: rgba(245, 158, 11, 0.12); color: #d97706; border-left: 3px solid #f59e0b; }
    .theme-dark .chip-work { background: rgba(59, 130, 246, 0.25); color: #93c5fd; }
    .theme-dark .chip-personal { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .theme-dark .chip-learning { background: rgba(139, 92, 246, 0.25); color: #c4b5fd; }
    .theme-dark .chip-entertainment { background: rgba(245, 158, 11, 0.25); color: #fcd34d; }

    /* Priority badge */
    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.65rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      background: rgba(0,0,0,0.05);
    }
    .priority-high { background: rgba(239,68,68,0.15); color: #dc2626; }
    .priority-medium { background: rgba(245,158,11,0.15); color: #d97706; }
    .priority-low { background: rgba(16,185,129,0.15); color: #059669; }

    /* FAB with pulse */
    .fab-glow {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 64px;
      height: 64px;
      border-radius: 999px;
      background: linear-gradient(145deg, #3b82f6, #7c3aed);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.5);
      cursor: pointer;
      z-index: 50;
      transition: all 0.2s;
      border: none;
      animation: gentlePulse 2s infinite;
    }

    @keyframes gentlePulse {
      0% { box-shadow: 0 12px 28px rgba(59, 130, 246, 0.4); }
      50% { box-shadow: 0 18px 38px rgba(59, 130, 246, 0.8); }
      100% { box-shadow: 0 12px 28px rgba(59, 130, 246, 0.4); }
    }

    .fab-glow:active { transform: scale(0.92); animation: none; }
    @media (hover: hover) { .fab-glow:hover { transform: scale(1.08); box-shadow: 0 24px 40px #3b82f6; } }

    /* Neo inputs */
    .neo-input {
      background: #ffffff;
      border: 2px solid transparent;
      transition: all 0.25s;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
    }
    .theme-dark .neo-input { background: #1f2937; color: #f1f5f9; }
    .neo-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); outline: none; }

    /* Toast */
    .toast-premium {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 1rem 2rem;
      border-radius: 3rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      font-weight: 600;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .theme-dark .toast-premium { background: #1e293b; border-color: #334155; }
    .toast-premium.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    /* Loading */
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(240, 244, 248, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: 0.3s;
    }
    .theme-dark .loader-overlay { background: rgba(10, 15, 28, 0.9); }
    .loader-overlay.hide { opacity: 0; visibility: hidden; }
    .loader-spinner { width: 70px; height: 70px; border: 4px solid rgba(59, 130, 246, 0.2); border-top: 4px solid #3b82f6; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sort dropdown */
    .sort-select {
      background: rgba(255,255,255,0.8);
      border-radius: 2rem;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
    }
    .theme-dark .sort-select { background: #1f2937; }

    /* Animation */
    @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    .bookmark-card { animation: slideUp 0.35s ease-out; }

    @media (max-width: 640px) {
      .fab-glow { width: 56px; height: 56px; bottom: 1.2rem; right: 1.2rem; font-size: 1.5rem; }
      .card-glass { border-radius: 1.5rem; }
    }
  </style>
</head>
<body class="antialiased overflow-x-hidden theme-light">

  <div id="loaderOverlay" class="loader-overlay"><div class="loader-spinner"></div></div>

  <div class="container max-w-6xl mx-auto px-5 md:px-6 py-6 md:py-8">
    <!-- Header with dynamic quote -->
    <div class="flex flex-wrap justify-between items-center gap-4 mb-10">
      <div class="flex items-center gap-4">
        <div class="bookmark-favicon !w-14 !h-14 !rounded-2xl shadow-xl"><i class="fa-solid fa-gem"></i></div>
        <div>
          <h1 class="text-4xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent">Bookmark Vault</h1>
          <p class="text-gray-500 dark:text-gray-400 text-xs mt-1 flex items-center gap-1"><i class="fas fa-bolt text-yellow-500"></i> Ultra · Smart sort · Priority tags</p>
        </div>
      </div>
      <div class="flex gap-3">
        <button id="statsModalBtn" class="p-3.5 rounded-full bg-white/80 dark:bg-gray-800 shadow-lg text-gray-700 dark:text-gray-200 transition-all active:scale-95 backdrop-blur-sm border border-gray-200 dark:border-gray-700" title="Statistics"><i class="fas fa-chart-simple"></i></button>
        <button id="themeSwitch" class="p-3.5 rounded-full bg-white/80 dark:bg-gray-800 shadow-lg text-gray-700 dark:text-gray-200 transition-all active:scale-95 text-xl backdrop-blur-sm border border-gray-200 dark:border-gray-700"><i class="fas fa-moon"></i></button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-12">
      <div class="stat-card text-center" data-stat="total"><i class="fas fa-database text-blue-400 text-xl mb-1"></i><div class="stat-number" id="statTotal">0</div><div class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Total</div></div>
      <div class="stat-card text-center" data-stat="work"><i class="fas fa-briefcase text-indigo-400 text-xl mb-1"></i><div class="stat-number" id="statWork">0</div><div class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Work</div></div>
      <div class="stat-card text-center" data-stat="personal"><i class="fas fa-heart text-pink-400 text-xl mb-1"></i><div class="stat-number" id="statPersonal">0</div><div class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Personal</div></div>
      <div class="stat-card text-center" data-stat="recent"><i class="fas fa-calendar-week text-green-400 text-xl mb-1"></i><div class="stat-number" id="statRecent">0</div><div class="text-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">New (7d)</div></div>
    </div>

    <!-- Form Card -->
    <div class="card-glass p-7 md:p-8 mb-10">
      <div class="flex items-center gap-3 mb-6 border-b border-gray-200 dark:border-gray-700 pb-4">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white shadow-md"><i class="fas fa-magic"></i></div>
        <h2 class="text-2xl font-bold" id="formTitle">✨ Create new bookmark</h2>
      </div>
      <form id="bookmarkForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div><label class="block text-sm font-bold mb-2"><i class="fas fa-heading text-blue-500 mr-1"></i> Title <span class="text-red-400">*</span></label><input type="text" id="title" placeholder="e.g., GitHub Copilot" class="neo-input w-full p-4 rounded-2xl"></div>
          <div><label class="block text-sm font-bold mb-2"><i class="fas fa-link text-purple-500 mr-1"></i> URL <span class="text-red-400">*</span></label><input type="url" id="url" placeholder="https://" class="neo-input w-full p-4 rounded-2xl"></div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
          <div><label class="block text-sm font-bold mb-2"><i class="fas fa-tags text-green-500 mr-1"></i> Category</label><select id="category" class="neo-input w-full p-4 rounded-2xl"><option value="personal">📒 Personal</option><option value="work">💼 Work</option><option value="learning">🎓 Learning</option><option value="entertainment">🎮 Entertainment</option></select></div>
          <div><label class="block text-sm font-bold mb-2"><i class="fas fa-flag text-orange-500 mr-1"></i> Priority</label><select id="priority" class="neo-input w-full p-4 rounded-2xl"><option value="low">🟢 Low</option><option value="medium">🟡 Medium</option><option value="high">🔴 High</option></select></div>
          <div><label class="block text-sm font-bold mb-2"><i class="fas fa-pen-alt text-gray-500 mr-1"></i> Description</label><textarea id="description" rows="2" class="neo-input w-full p-4 rounded-2xl resize-none" placeholder="Add notes..."></textarea></div>
        </div>
        <input type="hidden" id="editId">
        <div class="flex justify-end gap-4 pt-3">
          <button type="button" id="cancelFormBtn" class="px-7 py-3 border-2 border-gray-300 dark:border-gray-600 rounded-xl font-semibold hover:bg-gray-100 dark:hover:bg-gray-800 transition-all hidden">Cancel</button>
          <button type="submit" id="submitBtn" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold shadow-md hover:shadow-xl transition-all flex items-center gap-2"><i class="fas fa-plus-circle"></i> <span>Save Bookmark</span></button>
        </div>
      </form>
    </div>

    <!-- Filter & Bookmarks Section -->
    <div class="card-glass p-7 md:p-8">
      <div class="flex flex-col lg:flex-row justify-between lg:items-center gap-5 mb-7">
        <h2 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-archive text-blue-500"></i> Your Library</h2>
        <div class="flex flex-col sm:flex-row gap-4 w-full lg:w-auto">
          <div class="relative flex-1 lg:w-72"><i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" id="searchField" placeholder="Search..." class="neo-input w-full pl-12 pr-5 py-4 rounded-2xl"></div>
          <select id="categoryFilter" class="neo-input py-4 px-5 rounded-2xl w-full sm:w-44"><option value="all">📌 All</option><option value="work">💼 Work</option><option value="personal">❤️ Personal</option><option value="learning">📚 Learning</option><option value="entertainment">🎬 Entertainment</option></select>
          <select id="sortBy" class="neo-input py-4 px-5 rounded-2xl w-full sm:w-40"><option value="date">📅 Newest first</option><option value="oldest">📅 Oldest first</option><option value="title">🔤 Title A-Z</option><option value="priority">⭐ Priority</option></select>
        </div>
      </div>

      <!-- Tools bar -->
      <div class="flex flex-wrap gap-3 mb-8 pb-3 border-b border-gray-200 dark:border-gray-700">
        <button id="exportDataBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-md flex items-center gap-2 text-sm font-semibold transition-all"><i class="fas fa-download"></i> Export</button>
        <button id="importDataBtn" class="px-5 py-2.5 bg-violet-600 hover:bg-violet-700 text-white rounded-xl shadow-md flex items-center gap-2 text-sm font-semibold transition-all"><i class="fas fa-upload"></i> Import</button>
        <button id="clearEverythingBtn" class="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl shadow-md flex items-center gap-2 text-sm font-semibold transition-all"><i class="fas fa-trash-alt"></i> Wipe All</button>
        <button id="sampleDataBtn" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl shadow-md flex items-center gap-2 text-sm font-semibold transition-all"><i class="fas fa-flask"></i> Demo Samples</button>
        <input type="file" id="importFile" accept=".json" class="hidden">
      </div>

      <div id="bookmarksContainer" class="space-y-3 min-h-[280px]"></div>
    </div>
  </div>

  <button id="fabAddBtn" class="fab-glow" aria-label="Quick add"><i class="fas fa-plus"></i></button>
  <div id="toastMsg" class="toast-premium"><i id="toastIcon" class="fas fa-check-circle text-green-500 text-xl"></i><span id="toastText">Action done</span><button id="undoActionBtn" class="ml-4 text-blue-600 font-bold hidden bg-transparent hover:underline">Undo</button></div>

  <!-- Stats Modal -->
  <div id="statsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[150] hidden transition-all">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl">
      <div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold">📊 Insights</h3><button id="closeModalBtn" class="text-gray-500 text-2xl">&times;</button></div>
      <div id="modalStatsContent" class="space-y-3 text-sm"></div>
    </div>
  </div>

  <script>
    (function() {
      const loader = document.getElementById('loaderOverlay');
      const themeBtn = document.getElementById('themeSwitch');
      const form = document.getElementById('bookmarkForm');
      const titleInp = document.getElementById('title');
      const urlInp = document.getElementById('url');
      const catInp = document.getElementById('category');
      const priorityInp = document.getElementById('priority');
      const descInp = document.getElementById('description');
      const editIdInp = document.getElementById('editId');
      const cancelBtn = document.getElementById('cancelFormBtn');
      const submitBtn = document.getElementById('submitBtn');
      const formTitleSpan = document.getElementById('formTitle');
      const searchField = document.getElementById('searchField');
      const categoryFilter = document.getElementById('categoryFilter');
      const sortSelect = document.getElementById('sortBy');
      const bookmarksDiv = document.getElementById('bookmarksContainer');
      const fab = document.getElementById('fabAddBtn');
      const exportBtn = document.getElementById('exportDataBtn');
      const importBtn = document.getElementById('importDataBtn');
      const importFileInput = document.getElementById('importFile');
      const clearAllBtn = document.getElementById('clearEverythingBtn');
      const sampleBtn = document.getElementById('sampleDataBtn');
      const toastEl = document.getElementById('toastMsg');
      const toastTextSpan = document.getElementById('toastText');
      const toastIconSpan = document.getElementById('toastIcon');
      const undoBtn = document.getElementById('undoActionBtn');
      const statsModal = document.getElementById('statsModal');
      const statsModalBtn = document.getElementById('statsModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');

      const statTotal = document.getElementById('statTotal');
      const statWork = document.getElementById('statWork');
      const statPersonal = document.getElementById('statPersonal');
      const statRecent = document.getElementById('statRecent');

      let bookmarks = [];
      let isEditing = false;
      let lastDeletedItem = null;

      function isValidUrl(str) { try { new URL(str); return true; } catch { return false; } }
      function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m] || m)); }

      function showToast(msg, type = 'success', withUndo = null) {
        toastTextSpan.innerText = msg;
        toastIconSpan.className = type === 'error' ? 'fas fa-exclamation-triangle text-red-500 text-xl' : 'fas fa-check-circle text-green-500 text-xl';
        toastEl.classList.add('show');
        if (withUndo && typeof withUndo === 'function') {
          undoBtn.classList.remove('hidden');
          undoBtn.onclick = () => { withUndo(); toastEl.classList.remove('show'); };
        } else { undoBtn.classList.add('hidden'); undoBtn.onclick = null; }
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
      }

      function saveToLocal() { localStorage.setItem('bookmark_vault_ultra', JSON.stringify(bookmarks)); }

      function loadFromLocal() {
        try {
          const stored = localStorage.getItem('bookmark_vault_ultra');
          bookmarks = stored ? JSON.parse(stored) : [];
          if (!Array.isArray(bookmarks)) bookmarks = [];
          bookmarks = bookmarks.map(b => ({ ...b, id: b.id || Date.now() + '-' + Math.random().toString(36).substr(2, 8), createdAt: b.createdAt || new Date().toISOString(), priority: b.priority || 'medium' }));
        } catch(e) { bookmarks = []; }
      }

      function updateStats() {
        const total = bookmarks.length;
        const work = bookmarks.filter(b => b.category === 'work').length;
        const personal = bookmarks.filter(b => b.category === 'personal').length;
        const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
        const recent = bookmarks.filter(b => new Date(b.createdAt) >= weekAgo).length;
        statTotal.innerText = total;
        statWork.innerText = work;
        statPersonal.innerText = personal;
        statRecent.innerText = recent;
      }

      function getSortedBookmarks(filtered) {
        const sortType = sortSelect.value;
        const arr = [...filtered];
        if (sortType === 'date') return arr.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
        if (sortType === 'oldest') return arr.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
        if (sortType === 'title') return arr.sort((a,b) => a.title.localeCompare(b.title));
        if (sortType === 'priority') {
          const priorityOrder = { high: 3, medium: 2, low: 1 };
          return arr.sort((a,b) => (priorityOrder[b.priority||'medium'] || 2) - (priorityOrder[a.priority||'medium'] || 2));
        }
        return arr;
      }

      function renderBookmarks() {
        const searchTerm = searchField.value.trim().toLowerCase();
        const catVal = categoryFilter.value;
        let filtered = bookmarks.filter(b => {
          const matchSearch = searchTerm === '' || b.title.toLowerCase().includes(searchTerm) || b.url.toLowerCase().includes(searchTerm) || (b.description && b.description.toLowerCase().includes(searchTerm));
          const matchCat = catVal === 'all' || b.category === catVal;
          return matchSearch && matchCat;
        });
        filtered = getSortedBookmarks(filtered);
        if (filtered.length === 0) {
          bookmarksDiv.innerHTML = `<div class="empty-zone flex flex-col items-center py-20 text-gray-400"><i class="fas fa-folder-open text-7xl mb-5 opacity-30"></i><p class="text-xl font-semibold">No treasures found</p><p class="text-sm mt-1">Add a bookmark or adjust filters</p></div>`;
          updateStats(); return;
        }
        let html = '';
        filtered.forEach(bm => {
          let chipClass = '';
          if (bm.category === 'work') chipClass = 'chip-work';
          else if (bm.category === 'personal') chipClass = 'chip-personal';
          else if (bm.category === 'learning') chipClass = 'chip-learning';
          else chipClass = 'chip-entertainment';
          const catDisplay = bm.category.charAt(0).toUpperCase() + bm.category.slice(1);
          let priorityClass = '', priorityIcon = '';
          if (bm.priority === 'high') { priorityClass = 'priority-high'; priorityIcon = '🔴'; }
          else if (bm.priority === 'medium') { priorityClass = 'priority-medium'; priorityIcon = '🟡'; }
          else { priorityClass = 'priority-low'; priorityIcon = '🟢'; }
          const descHtml = bm.description ? `<p class="text-gray-500 dark:text-gray-400 text-sm mt-1.5 line-clamp-2 break-words">${escapeHtml(bm.description)}</p>` : '';
          html += `<div class="bookmark-card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4" data-id="${escapeHtml(bm.id)}">
              <div class="flex gap-4 flex-1 min-w-0">
                <div class="bookmark-favicon !w-12 !h-12 !rounded-xl flex-shrink-0"><i class="fa-regular fa-bookmark"></i></div>
                <div class="flex-1 min-w-0">
                  <a href="${escapeHtml(bm.url)}" target="_blank" rel="noopener" class="text-blue-700 dark:text-blue-400 font-extrabold text-lg hover:underline break-all">${escapeHtml(bm.title)}</a>
                  <div class="text-gray-500 dark:text-gray-400 text-sm truncate">${escapeHtml(bm.url)}</div>
                  ${descHtml}
                  <div class="mt-2 flex flex-wrap gap-2 items-center"><span class="chip-category ${chipClass}"><i class="fas fa-tag text-xs"></i> ${catDisplay}</span><span class="priority-badge ${priorityClass}"><i class="fas fa-flag"></i> ${priorityIcon} ${bm.priority.toUpperCase()}</span></div>
                </div>
              </div>
              <div class="flex gap-2 self-end sm:self-center">
                <button class="edit-action p-3 rounded-xl hover:bg-blue-100 dark:hover:bg-gray-700 text-blue-600 transition-all"><i class="fas fa-edit text-lg"></i></button>
                <button class="delete-action p-3 rounded-xl hover:bg-red-100 dark:hover:bg-gray-700 text-red-500 transition-all"><i class="fas fa-trash-alt text-lg"></i></button>
              </div>
            </div>`;
        });
        bookmarksDiv.innerHTML = html;
        updateStats();
        document.querySelectorAll('.edit-action').forEach(btn => { btn.addEventListener('click', (e) => { const card = e.target.closest('[data-id]'); if (card) editBookmark(card.dataset.id); }); });
        document.querySelectorAll('.delete-action').forEach(btn => { btn.addEventListener('click', (e) => { const card = e.target.closest('[data-id]'); if (card) deleteBookmark(card.dataset.id); }); });
      }

      function resetFormUI() {
        form.reset();
        editIdInp.value = '';
        isEditing = false;
        formTitleSpan.innerHTML = '✨ Create new bookmark';
        submitBtn.innerHTML = '<i class="fas fa-plus-circle"></i> <span>Save Bookmark</span>';
        cancelBtn.classList.add('hidden');
        urlInp.classList.remove('border-red-500');
        priorityInp.value = 'medium';
      }

      function editBookmark(id) {
        const bm = bookmarks.find(b => b.id === id);
        if (!bm) return;
        titleInp.value = bm.title;
        urlInp.value = bm.url;
        catInp.value = bm.category;
        priorityInp.value = bm.priority || 'medium';
        descInp.value = bm.description || '';
        editIdInp.value = bm.id;
        isEditing = true;
        formTitleSpan.innerHTML = '✏️ Edit bookmark';
        submitBtn.innerHTML = '<i class="fas fa-pen-fancy"></i> <span>Update Changes</span>';
        cancelBtn.classList.remove('hidden');
        document.querySelector('.card-glass').scrollIntoView({ behavior: 'smooth', block: 'center' });
        titleInp.focus();
      }

      function deleteBookmark(id) {
        const index = bookmarks.findIndex(b => b.id === id);
        if (index === -1) return;
        lastDeletedItem = bookmarks[index];
        bookmarks.splice(index, 1);
        saveToLocal();
        renderBookmarks();
        showToast('🗑️ Bookmark deleted', 'info', () => { if (lastDeletedItem) { bookmarks.push(lastDeletedItem); saveToLocal(); renderBookmarks(); showToast('↩️ Restored', 'success'); lastDeletedItem = null; } });
      }

      function addOrUpdate(e) {
        e.preventDefault();
        const title = titleInp.value.trim();
        let url = urlInp.value.trim();
        const category = catInp.value;
        const priority = priorityInp.value;
        const description = descInp.value.trim();
        if (!title || !url) { showToast('Title & URL required', 'error'); return; }
        if (!isValidUrl(url)) { urlInp.classList.add('border-red-500'); showToast('Valid URL needed (https://)', 'error'); return; }
        urlInp.classList.remove('border-red-500');
        if (isEditing && editIdInp.value) {
          const idx = bookmarks.findIndex(b => b.id === editIdInp.value);
          if (idx !== -1) { bookmarks[idx] = { ...bookmarks[idx], title, url, category, priority, description }; saveToLocal(); showToast('✏️ Updated', 'success'); resetFormUI(); renderBookmarks(); }
        } else {
          const newBm = { id: Date.now() + '-' + Math.random().toString(36).substring(2, 10), title, url, category, priority, description: description || '', createdAt: new Date().toISOString() };
          bookmarks.unshift(newBm);
          saveToLocal();
          showToast('✅ Added to vault', 'success');
          resetFormUI();
          renderBookmarks();
        }
        renderBookmarks();
      }

      function exportData() { const blob = new Blob([JSON.stringify(bookmarks, null, 2)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`bookmarks_${Date.now()}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('Exported', 'success'); }
      function importData(file) { const reader = new FileReader(); reader.onload = (ev) => { try { const imported = JSON.parse(ev.target.result); if (!Array.isArray(imported)) throw new Error(); let added=0; imported.forEach(item => { if(item.url && item.title && !bookmarks.some(b=>b.url===item.url)) { bookmarks.push({ id:Date.now()+'-'+Math.random().toString(36).substr(2,8), title:item.title, url:item.url, category:item.category||'personal', priority:item.priority||'medium', description:item.description||'', createdAt:item.createdAt||new Date().toISOString() }); added++; } }); if(added) { saveToLocal(); renderBookmarks(); showToast(`Imported ${added} items`, 'success'); } else showToast('No new items', 'info'); } catch(e) { showToast('Invalid JSON', 'error'); } }; reader.readAsText(file); }
      function clearAll() { if(bookmarks.length===0) return; if(confirm(`Delete ${bookmarks.length} bookmarks permanently?`)) { bookmarks=[]; saveToLocal(); renderBookmarks(); showToast('All cleared', 'info'); } }
      function loadSamples() { const samples = [{ title:"GitHub", url:"https://github.com", category:"work", priority:"high", description:"Code hosting" },{ title:"YouTube", url:"https://youtube.com", category:"entertainment", priority:"medium", description:"Video platform" },{ title:"MDN Web Docs", url:"https://developer.mozilla.org", category:"learning", priority:"high", description:"Web dev docs" },{ title:"Pinterest", url:"https://pinterest.com", category:"personal", priority:"low", description:"Inspiration" }]; let added=0; samples.forEach(s=>{ if(!bookmarks.some(b=>b.url===s.url)) { bookmarks.push({ ...s, id:Date.now()+'-'+Math.random().toString(36).substr(2,8), createdAt:new Date().toISOString() }); added++; } }); if(added) { saveToLocal(); renderBookmarks(); showToast(`✨ Added ${added} demo bookmarks`, 'success'); } else showToast('Samples already exist', 'info'); }
      function showStatsModal() { const total=bookmarks.length; const high=bookmarks.filter(b=>b.priority==='high').length; const cats={work:0,personal:0,learning:0,entertainment:0}; bookmarks.forEach(b=>{if(cats[b.category]!==undefined) cats[b.category]++;}); document.getElementById('modalStatsContent').innerHTML=`<p><i class="fas fa-database"></i> Total: <strong>${total}</strong></p><p><i class="fas fa-flag"></i> High priority: <strong>${high}</strong></p><p><i class="fas fa-briefcase"></i> Work: ${cats.work}</p><p><i class="fas fa-heart"></i> Personal: ${cats.personal}</p><p><i class="fas fa-graduation-cap"></i> Learning: ${cats.learning}</p><p><i class="fas fa-gamepad"></i> Entertainment: ${cats.entertainment}</p>`; statsModal.classList.remove('hidden'); }
      function closeModal() { statsModal.classList.add('hidden'); }

      function setTheme(theme) { if(theme==='dark'){ document.body.classList.add('theme-dark'); document.body.classList.remove('theme-light'); themeBtn.innerHTML='<i class="fas fa-sun"></i>'; localStorage.setItem('vault_theme','dark'); } else { document.body.classList.add('theme-light'); document.body.classList.remove('theme-dark'); themeBtn.innerHTML='<i class="fas fa-moon"></i>'; localStorage.setItem('vault_theme','light'); } }
      function initTheme() { setTheme(localStorage.getItem('vault_theme') || 'light'); }

      document.addEventListener('keydown', (e) => { if((e.ctrlKey && e.key === 'k') || (e.key === '/' && document.activeElement !== searchField)) { e.preventDefault(); searchField.focus(); } if(e.key === 'Escape') searchField.blur(); if(e.key === 'Escape' && statsModal.classList.contains('hidden')===false) closeModal(); });

      function init() { loadFromLocal(); initTheme(); renderBookmarks(); setTimeout(()=>loader.classList.add('hide'),400); form.addEventListener('submit',addOrUpdate); cancelBtn.addEventListener('click',resetFormUI); searchField.addEventListener('input',renderBookmarks); categoryFilter.addEventListener('change',renderBookmarks); sortSelect.addEventListener('change',renderBookmarks); fab.addEventListener('click',()=>{ resetFormUI(); document.querySelector('.card-glass').scrollIntoView({behavior:'smooth'}); titleInp.focus(); }); exportBtn.addEventListener('click',exportData); importBtn.addEventListener('click',()=>importFileInput.click()); importFileInput.addEventListener('change',(e)=>{ if(e.target.files[0]) importData(e.target.files[0]); importFileInput.value=''; }); clearAllBtn.addEventListener('click',clearAll); sampleBtn.addEventListener('click',loadSamples); themeBtn.addEventListener('click',()=>setTheme(document.body.classList.contains('theme-dark')?'light':'dark')); statsModalBtn.addEventListener('click',showStatsModal); closeModalBtn.addEventListener('click',closeModal); statsModal.addEventListener('click',(e)=>{if(e.target===statsModal) closeModal();}); }
      init();
    })();
  </script>
</body>
</html>
