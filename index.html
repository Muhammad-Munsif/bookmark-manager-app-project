<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <title>Bookmark Vault | Secure Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #60a5fa;
      --secondary: #8b5cf6;
      --secondary-dark: #7c3aed;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg-light: #f0f4f8;
      --bg-dark: #0a0f1c;
      --text-light: #0f172a;
      --text-dark: #eef2ff;
      --card-light: #ffffff;
      --card-dark: #111827;
      --border-light: #e2e8f0;
      --border-dark: #1f2937;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background 0.3s ease, color 0.2s;
      background-color: var(--bg-light);
      color: var(--text-light);
      line-height: 1.5;
    }

    .theme-dark {
      background-color: var(--bg-dark) !important;
      color: var(--text-dark) !important;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .theme-dark .glass-card {
      background: rgba(17, 24, 39, 0.85);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .neo-input {
      background: #ffffff;
      border: 2px solid transparent;
      transition: all 0.25s;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
    }

    .theme-dark .neo-input {
      background: #1f2937;
      color: #f1f5f9;
    }

    .neo-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      transition: all 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
    }

    .toast-premium {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 0.9rem 1.8rem;
      border-radius: 3rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      font-weight: 600;
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .theme-dark .toast-premium {
      background: #1e293b;
      border-color: #334155;
    }

    .toast-premium.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(240, 244, 248, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: 0.3s;
    }

    .theme-dark .loader-overlay {
      background: rgba(10, 15, 28, 0.9);
    }

    .loader-overlay.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(59, 130, 246, 0.2);
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .bookmark-card {
      background: var(--card-light);
      border-radius: 1.5rem;
      border: 1px solid var(--border-light);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      margin-bottom: 0.875rem;
    }

    .theme-dark .bookmark-card {
      background: var(--card-dark);
      border-color: var(--border-dark);
    }

    .bookmark-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.15);
      border-color: var(--primary-light);
    }

    .bookmark-favicon {
      width: 48px;
      height: 48px;
      background: linear-gradient(145deg, #3b82f6, #8b5cf6);
      border-radius: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: white;
    }

    .chip-category {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .chip-work {
      background: rgba(59, 130, 246, 0.15);
      color: #2563eb;
    }

    .chip-personal {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }

    .chip-learning {
      background: rgba(139, 92, 246, 0.12);
      color: #7c3aed;
    }

    .chip-entertainment {
      background: rgba(245, 158, 11, 0.12);
      color: #d97706;
    }

    .priority-badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
    }

    .priority-high {
      background: rgba(239, 68, 68, 0.15);
      color: #dc2626;
    }

    .priority-medium {
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
    }

    .priority-low {
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
    }

    .fab-glow {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 999px;
      background: linear-gradient(145deg, #3b82f6, #7c3aed);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.5);
      cursor: pointer;
      z-index: 50;
      transition: all 0.2s;
      border: none;
    }

    .fab-glow:active {
      transform: scale(0.92);
    }

    @media (max-width: 640px) {
      .fab-glow {
        width: 54px;
        height: 54px;
        bottom: 1.2rem;
        right: 1.2rem;
      }
    }

    .stat-card {
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      border-radius: 1.5rem;
      padding: 0.8rem 0.3rem;
      text-align: center;
      border: 1px solid rgba(59, 130, 246, 0.2);
      transition: all 0.2s;
    }

    .theme-dark .stat-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
    }

    .stat-number {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out;
    }
  </style>
</head>

<body class="antialiased overflow-x-hidden theme-light">

  <div id="loaderOverlay" class="loader-overlay">
    <div class="loader-spinner"></div>
  </div>

  <!-- LOGIN / SIGNUP MODAL -->
  <div id="authModal"
    class="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md transition-all">
    <div class="glass-card w-full max-w-md p-6 md:p-8 relative animate-fadeIn">
      <div class="text-center mb-6">
        <div
          class="w-16 h-16 mx-auto bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg mb-3">
          <i class="fa-solid fa-vault"></i>
        </div>
        <h2 class="text-2xl font-bold" id="authTitle">Welcome Back</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1" id="authSubtitle">Sign in to access your vault</p>
      </div>

      <form id="authForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1.5"><i class="fas fa-user mr-1"></i> Username</label>
          <input type="text" id="authUsername" class="neo-input w-full p-3 rounded-xl" placeholder="e.g., john_doe"
            required autocomplete="username">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1.5"><i class="fas fa-lock mr-1"></i> Password</label>
          <input type="password" id="authPassword" class="neo-input w-full p-3 rounded-xl" placeholder="••••••••"
            required autocomplete="current-password">
        </div>
        <button type="submit"
          class="btn-primary w-full py-3 rounded-xl text-white font-bold text-lg transition-all">Login</button>
      </form>

      <div class="mt-5 text-center text-sm">
        <span class="text-gray-500 dark:text-gray-400">Don't have an account?</span>
        <button id="switchToSignupBtn" class="text-blue-600 dark:text-blue-400 font-semibold ml-1 hover:underline">Sign
          up</button>
      </div>
      <div class="mt-3 text-center text-xs text-gray-400">✨ Create an account to start your personal bookmark vault
      </div>
    </div>
  </div>

  <!-- MAIN APP (Hidden until login) -->
  <div id="mainApp" style="display: none;">
    <div class="container max-w-6xl mx-auto px-5 md:px-6 py-6 md:py-8">
      <!-- Header -->
      <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
        <div class="flex items-center gap-4">
          <div class="bookmark-favicon !w-12 !h-12 !rounded-xl"><i class="fa-solid fa-gem"></i></div>
          <div>
            <h1
              class="text-3xl md:text-4xl font-black bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
              Bookmark Vault</h1>
            <p class="text-gray-500 dark:text-gray-400 text-xs flex items-center gap-1"><i
                class="fas fa-user-check text-green-500"></i> Welcome, <span id="currentUserSpan">User</span></p>
          </div>
        </div>
        <div class="flex gap-3">
          <button id="statsModalBtn" class="p-3 rounded-full bg-white/80 dark:bg-gray-800 shadow-md"><i
              class="fas fa-chart-simple"></i></button>
          <button id="themeSwitch" class="p-3 rounded-full bg-white/80 dark:bg-gray-800 shadow-md text-xl"><i
              class="fas fa-moon"></i></button>
          <button id="logoutBtn" class="p-3 rounded-full bg-red-100 dark:bg-red-900/30 text-red-600 shadow-md"><i
              class="fas fa-sign-out-alt"></i></button>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
        <div class="stat-card">
          <div class="stat-number" id="statTotal">0</div>
          <div class="text-xs uppercase">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statWork">0</div>
          <div class="text-xs uppercase">Work</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statPersonal">0</div>
          <div class="text-xs uppercase">Personal</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="statRecent">0</div>
          <div class="text-xs uppercase">New (7d)</div>
        </div>
      </div>

      <!-- Form Card -->
      <div class="glass-card p-6 md:p-7 mb-8">
        <div class="flex items-center gap-2 mb-5 border-b pb-3"><i class="fas fa-magic text-blue-500 text-xl"></i>
          <h2 class="text-xl font-bold" id="formTitle">✨ Add new bookmark</h2>
        </div>
        <form id="bookmarkForm" class="space-y-5">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div><input type="text" id="title" placeholder="Title *" class="neo-input w-full p-3.5 rounded-xl"></div>
            <div><input type="url" id="url" placeholder="https:// *" class="neo-input w-full p-3.5 rounded-xl"></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <select id="category" class="neo-input p-3.5 rounded-xl">
              <option value="personal">📒 Personal</option>
              <option value="work">💼 Work</option>
              <option value="learning">🎓 Learning</option>
              <option value="entertainment">🎮 Entertainment</option>
            </select>
            <select id="priority" class="neo-input p-3.5 rounded-xl">
              <option value="low">🟢 Low</option>
              <option value="medium">🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
            <textarea id="description" rows="1" placeholder="Description (optional)"
              class="neo-input p-3.5 rounded-xl resize-none"></textarea>
          </div>
          <input type="hidden" id="editId">
          <div class="flex justify-end gap-3">
            <button type="button" id="cancelFormBtn" class="px-5 py-2.5 border-2 rounded-xl hidden">Cancel</button>
            <button type="submit"
              class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold shadow-md">Save</button>
          </div>
        </form>
      </div>

      <!-- Filters & List -->
      <div class="glass-card p-6 md:p-7">
        <div class="flex flex-wrap justify-between gap-4 mb-5">
          <div class="flex gap-3 flex-wrap">
            <input type="text" id="searchField" placeholder="Search..."
              class="neo-input px-4 py-3 rounded-xl w-48 md:w-64">
            <select id="categoryFilter" class="neo-input px-4 py-3 rounded-xl">
              <option value="all">All</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="learning">Learning</option>
              <option value="entertainment">Entertainment</option>
            </select>
            <select id="sortBy" class="neo-input px-4 py-3 rounded-xl">
              <option value="date">Newest</option>
              <option value="priority">Priority</option>
              <option value="title">Title</option>
            </select>
          </div>
          <div class="flex gap-2">
            <button id="exportBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm"><i
                class="fas fa-download"></i> Export</button>
            <button id="importBtn" class="px-4 py-2 bg-violet-600 text-white rounded-xl text-sm"><i
                class="fas fa-upload"></i> Import</button>
            <button id="clearAllBtn" class="px-4 py-2 bg-rose-500 text-white rounded-xl text-sm"><i
                class="fas fa-trash"></i> Clear</button>
            <button id="sampleBtn" class="px-4 py-2 bg-amber-600 text-white rounded-xl text-sm"><i
                class="fas fa-flask"></i> Demo</button>
            <input type="file" id="importFile" accept=".json" class="hidden">
          </div>
        </div>
        <div id="bookmarksContainer" class="space-y-3 min-h-[240px]"></div>
      </div>
    </div>
    <button id="fabAddBtn" class="fab-glow"><i class="fas fa-plus"></i></button>
  </div>

  <div id="toastMsg" class="toast-premium"><i id="toastIcon" class="fas fa-check-circle text-green-500"></i><span
      id="toastText">Done</span><button id="undoActionBtn" class="ml-3 text-blue-600 font-bold hidden">Undo</button>
  </div>
  <div id="statsModal"
    class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[150] hidden">
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 max-w-xs w-full">
      <div class="flex justify-between mb-3">
        <h3 class="font-bold">Insights</h3><button id="closeModalBtn">&times;</button>
      </div>
      <div id="modalStatsContent"></div>
    </div>
  </div>

  <script src="js/script.js">
    
(function () {
  // ---------- AUTHENTICATION SYSTEM ----------
  let currentUser = null;
  let bookmarks = [];
  let isEditing = false;
  let lastDeletedItem = null;

  // DOM elements
  const authModal = document.getElementById('authModal');
  const mainApp = document.getElementById('mainApp');
  const authForm = document.getElementById('authForm');
  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');
  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');
  const switchBtn = document.getElementById('switchToSignupBtn');
  let isLoginMode = true;

  // Main app elements
  const themeBtn = document.getElementById('themeSwitch');
  const logoutBtn = document.getElementById('logoutBtn');
  const currentUserSpan = document.getElementById('currentUserSpan');
  const form = document.getElementById('bookmarkForm');
  const titleInp = document.getElementById('title');
  const urlInp = document.getElementById('url');
  const catInp = document.getElementById('category');
  const priorityInp = document.getElementById('priority');
  const descInp = document.getElementById('description');
  const editIdInp = document.getElementById('editId');
  const cancelBtn = document.getElementById('cancelFormBtn');
  const formTitleSpan = document.getElementById('formTitle');
  const searchField = document.getElementById('searchField');
  const categoryFilter = document.getElementById('categoryFilter');
  const sortSelect = document.getElementById('sortBy');
  const bookmarksDiv = document.getElementById('bookmarksContainer');
  const fab = document.getElementById('fabAddBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importFileInput = document.getElementById('importFile');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const sampleBtn = document.getElementById('sampleBtn');
  const statsModalBtn = document.getElementById('statsModalBtn');
  const statsModal = document.getElementById('statsModal');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const toastEl = document.getElementById('toastMsg');
  const toastText = document.getElementById('toastText');
  const toastIcon = document.getElementById('toastIcon');
  const undoBtn = document.getElementById('undoActionBtn');
  const statTotal = document.getElementById('statTotal');
  const statWork = document.getElementById('statWork');
  const statPersonal = document.getElementById('statPersonal');
  const statRecent = document.getElementById('statRecent');
  const loader = document.getElementById('loaderOverlay');

  // Helper functions
  function showToast(msg, type = 'success', undoCallback = null) {
    toastText.innerText = msg;
    toastIcon.className = type === 'error' ? 'fas fa-exclamation-triangle text-red-500' : 'fas fa-check-circle text-green-500';
    toastEl.classList.add('show');
    if (undoCallback && typeof undoCallback === 'function') {
      undoBtn.classList.remove('hidden');
      undoBtn.onclick = () => { undoCallback(); toastEl.classList.remove('show'); };
    } else { undoBtn.classList.add('hidden'); undoBtn.onclick = null; }
    setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  // Save user's bookmarks to localStorage (encrypted-like structure)
  function saveUserData() {
    if (!currentUser) return;
    const users = JSON.parse(localStorage.getItem('bookmark_users') || '{}');
    // Store bookmarks array for this user
    users[currentUser] = {
      password: users[currentUser] ? users[currentUser].password : null,
      bookmarks: bookmarks
    };
    localStorage.setItem('bookmark_users', JSON.stringify(users));
    localStorage.setItem('bookmark_current_user', currentUser);
  }

  function loadUserData() {
    if (!currentUser) return;
    const users = JSON.parse(localStorage.getItem('bookmark_users') || '{}');
    const userData = users[currentUser];
    bookmarks = (userData && userData.bookmarks) ? userData.bookmarks : [];
    bookmarks = bookmarks.map(b => ({
      ...b,
      id: b.id || Date.now() + '-' + Math.random().toString(36).substr(2, 6),
      createdAt: b.createdAt || new Date().toISOString(),
      priority: b.priority || 'medium'
    }));
    saveUserData(); // ensure consistency
    renderBookmarks();
  }

  function updateStats() {
    const total = bookmarks.length;
    const work = bookmarks.filter(b => b.category === 'work').length;
    const personal = bookmarks.filter(b => b.category === 'personal').length;
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    const recent = bookmarks.filter(b => new Date(b.createdAt) >= weekAgo).length;
    statTotal.innerText = total;
    statWork.innerText = work;
    statPersonal.innerText = personal;
    statRecent.innerText = recent;
  }

  function getSortedBookmarks(filtered) {
    const sortType = sortSelect.value;
    const arr = [...filtered];
    if (sortType === 'date') return arr.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (sortType === 'title') return arr.sort((a, b) => a.title.localeCompare(b.title));
    if (sortType === 'priority') {
      const order = { high: 3, medium: 2, low: 1 };
      return arr.sort((a, b) => (order[b.priority || 'medium'] || 2) - (order[a.priority || 'medium'] || 2));
    }
    return arr;
  }

  function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }

  function renderBookmarks() {
    const searchTerm = searchField.value.trim().toLowerCase();
    const catVal = categoryFilter.value;
    let filtered = bookmarks.filter(b => {
      const matchSearch = searchTerm === '' || b.title.toLowerCase().includes(searchTerm) || b.url.toLowerCase().includes(searchTerm) || (b.description && b.description.toLowerCase().includes(searchTerm));
      const matchCat = catVal === 'all' || b.category === catVal;
      return matchSearch && matchCat;
    });
    filtered = getSortedBookmarks(filtered);
    if (filtered.length === 0) {
      bookmarksDiv.innerHTML = `<div class="text-center py-16 text-gray-400"><i class="fas fa-folder-open text-6xl mb-3 opacity-40"></i><p>No bookmarks yet</p><p class="text-xs mt-1">Click + to add your first bookmark</p></div>`;
      updateStats();
      return;
    }
    let html = '';
    filtered.forEach(bm => {
      let chipClass = bm.category === 'work' ? 'chip-work' : bm.category === 'personal' ? 'chip-personal' : bm.category === 'learning' ? 'chip-learning' : 'chip-entertainment';
      let catDisplay = bm.category.charAt(0).toUpperCase() + bm.category.slice(1);
      let priorityClass = bm.priority === 'high' ? 'priority-high' : bm.priority === 'medium' ? 'priority-medium' : 'priority-low';
      let priorityIcon = bm.priority === 'high' ? '🔴' : bm.priority === 'medium' ? '🟡' : '🟢';
      html += `<div class="bookmark-card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3" data-id="${escapeHtml(bm.id)}">
            <div class="flex gap-3 flex-1 min-w-0"><div class="bookmark-favicon !w-10 !h-10 !rounded-xl text-sm"><i class="fa-regular fa-bookmark"></i></div>
            <div class="flex-1"><a href="${escapeHtml(bm.url)}" target="_blank" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">${escapeHtml(bm.title)}</a>
            <div class="text-gray-500 text-xs truncate">${escapeHtml(bm.url)}</div>
            ${bm.description ? `<p class="text-gray-500 dark:text-gray-400 text-xs mt-1">${escapeHtml(bm.description)}</p>` : ''}
            <div class="flex flex-wrap gap-2 mt-1.5"><span class="chip-category ${chipClass} text-xs">${catDisplay}</span><span class="priority-badge ${priorityClass} text-[11px]"><i class="fas fa-flag"></i> ${priorityIcon} ${bm.priority.toUpperCase()}</span></div>
            </div></div>
            <div class="flex gap-2"><button class="edit-action p-2 rounded-xl hover:bg-blue-100"><i class="fas fa-edit"></i></button><button class="delete-action p-2 rounded-xl hover:bg-red-100 text-red-500"><i class="fas fa-trash-alt"></i></button></div>
          </div>`;
    });
    bookmarksDiv.innerHTML = html;
    updateStats();
    document.querySelectorAll('.edit-action').forEach(btn => btn.addEventListener('click', (e) => { const card = e.target.closest('[data-id]'); if (card) editBookmark(card.dataset.id); }));
    document.querySelectorAll('.delete-action').forEach(btn => btn.addEventListener('click', (e) => { const card = e.target.closest('[data-id]'); if (card) deleteBookmark(card.dataset.id); }));
  }

  function resetFormUI() { form.reset(); editIdInp.value = ''; isEditing = false; formTitleSpan.innerText = '✨ Add new bookmark'; cancelBtn.classList.add('hidden'); priorityInp.value = 'medium'; }
  function editBookmark(id) { const bm = bookmarks.find(b => b.id === id); if (!bm) return; titleInp.value = bm.title; urlInp.value = bm.url; catInp.value = bm.category; priorityInp.value = bm.priority || 'medium'; descInp.value = bm.description || ''; editIdInp.value = bm.id; isEditing = true; formTitleSpan.innerText = '✏️ Edit bookmark'; cancelBtn.classList.remove('hidden'); document.querySelector('.glass-card').scrollIntoView({ behavior: 'smooth' }); }
  function deleteBookmark(id) { const idx = bookmarks.findIndex(b => b.id === id); if (idx === -1) return; lastDeletedItem = bookmarks[idx]; bookmarks.splice(idx, 1); saveUserData(); renderBookmarks(); showToast('Bookmark deleted', 'info', () => { if (lastDeletedItem) { bookmarks.push(lastDeletedItem); saveUserData(); renderBookmarks(); showToast('Restored', 'success'); lastDeletedItem = null; } }); }
  function addOrUpdate(e) {
    e.preventDefault();
    const title = titleInp.value.trim();
    let url = urlInp.value.trim();
    const category = catInp.value;
    const priority = priorityInp.value;
    const description = descInp.value.trim();
    if (!title || !url) { showToast('Title & URL required', 'error'); return; }
    try { new URL(url); } catch (e) { urlInp.classList.add('border-red-500'); showToast('Invalid URL (include https://)', 'error'); return; }
    urlInp.classList.remove('border-red-500');
    if (isEditing && editIdInp.value) {
      const idx = bookmarks.findIndex(b => b.id === editIdInp.value);
      if (idx !== -1) { bookmarks[idx] = { ...bookmarks[idx], title, url, category, priority, description }; saveUserData(); showToast('Updated', 'success'); resetFormUI(); renderBookmarks(); }
    } else {
      const newBm = { id: Date.now() + '-' + Math.random().toString(36).substring(2, 10), title, url, category, priority, description: description || '', createdAt: new Date().toISOString() };
      bookmarks.unshift(newBm); saveUserData(); showToast('Added to vault', 'success'); resetFormUI(); renderBookmarks();
    }
    renderBookmarks();
  }
  function exportData() { const dataStr = JSON.stringify(bookmarks, null, 2); const blob = new Blob([dataStr], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bookmarks_${currentUser}_${Date.now()}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('Exported', 'success'); }
  function importData(file) { const reader = new FileReader(); reader.onload = (ev) => { try { const imported = JSON.parse(ev.target.result); if (!Array.isArray(imported)) throw new Error(); let added = 0; imported.forEach(item => { if (item.url && item.title && !bookmarks.some(b => b.url === item.url)) { bookmarks.push({ id: Date.now() + '-' + Math.random().toString(36).substr(2, 8), title: item.title, url: item.url, category: item.category || 'personal', priority: item.priority || 'medium', description: item.description || '', createdAt: item.createdAt || new Date().toISOString() }); added++; } }); if (added) { saveUserData(); renderBookmarks(); showToast(`Imported ${added} items`, 'success'); } else showToast('No new items', 'info'); } catch (e) { showToast('Invalid JSON', 'error'); } }; reader.readAsText(file); }
  function clearAll() { if (bookmarks.length === 0) return; if (confirm(`Delete ${bookmarks.length} bookmarks permanently?`)) { bookmarks = []; saveUserData(); renderBookmarks(); showToast('All cleared', 'info'); } }
  function loadSamples() { const samples = [{ title: "GitHub", url: "https://github.com", category: "work", priority: "high", description: "Code hosting" }, { title: "YouTube", url: "https://youtube.com", category: "entertainment", priority: "medium", description: "Videos" }, { title: "MDN Web Docs", url: "https://developer.mozilla.org", category: "learning", priority: "high", description: "Web dev docs" }, { title: "Pinterest", url: "https://pinterest.com", category: "personal", priority: "low", description: "Inspiration" }]; let added = 0; samples.forEach(s => { if (!bookmarks.some(b => b.url === s.url)) { bookmarks.push({ ...s, id: Date.now() + '-' + Math.random().toString(36).substr(2, 8), createdAt: new Date().toISOString() }); added++; } }); if (added) { saveUserData(); renderBookmarks(); showToast(`✨ Added ${added} demos`, 'success'); } else showToast('Samples already exist', 'info'); }
  function showStatsModalFunc() { const total = bookmarks.length; const high = bookmarks.filter(b => b.priority === 'high').length; const cats = { work: 0, personal: 0, learning: 0, entertainment: 0 }; bookmarks.forEach(b => { if (cats[b.category] !== undefined) cats[b.category]++; }); document.getElementById('modalStatsContent').innerHTML = `<p>📊 Total: ${total}</p><p>🔴 High priority: ${high}</p><p>💼 Work: ${cats.work}</p><p>❤️ Personal: ${cats.personal}</p><p>🎓 Learning: ${cats.learning}</p><p>🎬 Entertainment: ${cats.entertainment}</p>`; statsModal.classList.remove('hidden'); }
  function closeModal() { statsModal.classList.add('hidden'); }
  function setTheme(theme) { if (theme === 'dark') { document.body.classList.add('theme-dark'); document.body.classList.remove('theme-light'); themeBtn.innerHTML = '<i class="fas fa-sun"></i>'; localStorage.setItem('vault_theme', 'dark'); } else { document.body.classList.add('theme-light'); document.body.classList.remove('theme-dark'); themeBtn.innerHTML = '<i class="fas fa-moon"></i>'; localStorage.setItem('vault_theme', 'light'); } }
  function initTheme() { setTheme(localStorage.getItem('vault_theme') || 'light'); }

  // ---------- AUTH HANDLERS ----------
  function handleAuthSubmit(e) {
    e.preventDefault();
    const username = authUsername.value.trim().toLowerCase();
    const password = authPassword.value.trim();
    if (!username || !password) { showToast('Please fill all fields', 'error'); return; }
    const users = JSON.parse(localStorage.getItem('bookmark_users') || '{}');

    if (isLoginMode) {
      // LOGIN: Check if user exists and password matches
      if (users[username] && users[username].password === password) {
        currentUser = username;
        bookmarks = users[username].bookmarks || [];
        bookmarks = bookmarks.map(b => ({ ...b, id: b.id || Date.now() + '-' + Math.random().toString(36).substr(2, 6), createdAt: b.createdAt || new Date().toISOString(), priority: b.priority || 'medium' }));
        localStorage.setItem('bookmark_current_user', currentUser);
        saveUserData();
        authModal.style.display = 'none';
        mainApp.style.display = 'block';
        currentUserSpan.innerText = currentUser;
        renderBookmarks();
        showToast(`Welcome back, ${username}!`, 'success');
      } else {
        showToast('Invalid username or password', 'error');
      }
    } else {
      // SIGNUP: Create new account
      if (users[username]) {
        showToast('Username already exists. Please login.', 'error');
        return;
      }
      // Create new user with empty bookmarks
      users[username] = {
        password: password,
        bookmarks: []
      };
      localStorage.setItem('bookmark_users', JSON.stringify(users));
      currentUser = username;
      bookmarks = [];
      localStorage.setItem('bookmark_current_user', currentUser);
      saveUserData();
      authModal.style.display = 'none';
      mainApp.style.display = 'block';
      currentUserSpan.innerText = currentUser;
      renderBookmarks();
      showToast(`Account created! Welcome to Bookmark Vault, ${username}! 🎉`, 'success');
    }
    authForm.reset();
  }

  function switchMode() {
    isLoginMode = !isLoginMode;
    if (isLoginMode) {
      authTitle.innerText = 'Welcome Back';
      authSubtitle.innerText = 'Sign in to access your vault';
      switchBtn.innerText = 'Sign up';
      authForm.querySelector('button').innerText = 'Login';
    } else {
      authTitle.innerText = 'Create Account';
      authSubtitle.innerText = 'Sign up to start your personal vault';
      switchBtn.innerText = 'Login';
      authForm.querySelector('button').innerText = 'Sign up';
    }
  }

  function logout() {
    currentUser = null;
    bookmarks = [];
    localStorage.removeItem('bookmark_current_user');
    mainApp.style.display = 'none';
    authModal.style.display = 'flex';
    authForm.reset();
    isLoginMode = true;
    authTitle.innerText = 'Welcome Back';
    authSubtitle.innerText = 'Sign in to access your vault';
    authForm.querySelector('button').innerText = 'Login';
    switchBtn.innerText = 'Sign up';
    showToast('Logged out successfully', 'info');
  }

  // Auto-login check for existing session
  function checkAutoLogin() {
    const savedUser = localStorage.getItem('bookmark_current_user');
    if (savedUser) {
      const users = JSON.parse(localStorage.getItem('bookmark_users') || '{}');
      if (users[savedUser]) {
        currentUser = savedUser;
        bookmarks = users[savedUser].bookmarks || [];
        bookmarks = bookmarks.map(b => ({ ...b, id: b.id || Date.now() + '-' + Math.random().toString(36).substr(2, 6), createdAt: b.createdAt || new Date().toISOString(), priority: b.priority || 'medium' }));
        authModal.style.display = 'none';
        mainApp.style.display = 'block';
        currentUserSpan.innerText = currentUser;
        renderBookmarks();
      } else {
        authModal.style.display = 'flex';
        mainApp.style.display = 'none';
      }
    } else {
      authModal.style.display = 'flex';
      mainApp.style.display = 'none';
    }
    setTimeout(() => loader.classList.add('hide'), 300);
  }

  // Event listeners
  authForm.addEventListener('submit', handleAuthSubmit);
  switchBtn.addEventListener('click', switchMode);
  logoutBtn.addEventListener('click', logout);
  form.addEventListener('submit', addOrUpdate);
  cancelBtn.addEventListener('click', resetFormUI);
  searchField.addEventListener('input', renderBookmarks);
  categoryFilter.addEventListener('change', renderBookmarks);
  sortSelect.addEventListener('change', renderBookmarks);
  fab.addEventListener('click', () => { resetFormUI(); document.querySelector('.glass-card').scrollIntoView({ behavior: 'smooth' }); titleInp.focus(); });
  exportBtn.addEventListener('click', exportData);
  importBtn.addEventListener('click', () => importFileInput.click());
  importFileInput.addEventListener('change', (e) => { if (e.target.files[0]) importData(e.target.files[0]); importFileInput.value = ''; });
  clearAllBtn.addEventListener('click', clearAll);
  sampleBtn.addEventListener('click', loadSamples);
  statsModalBtn.addEventListener('click', showStatsModalFunc);
  closeModalBtn.addEventListener('click', closeModal);
  statsModal.addEventListener('click', (e) => { if (e.target === statsModal) closeModal(); });
  themeBtn.addEventListener('click', () => setTheme(document.body.classList.contains('theme-dark') ? 'light' : 'dark'));

  initTheme();
  checkAutoLogin();
})();

  </script>
</body>

</html>
