<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Bookmark Hub — Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="theme-light antialiased overflow-x-hidden">
  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div class="container mx-auto px-4 py-5 md:py-8 max-w-6xl">
    <!-- Header -->
    <header class="flex flex-wrap justify-between items-center mb-7 gap-4">
      <div class="flex items-center gap-3">
        <div class="bookmark-icon shadow-xl"><i class="fa-solid fa-bookmark"></i></div>
        <div>
          <h1
            class="text-3xl md:text-4xl lg:text-5xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
            Bookmark Hub
          </h1>
          <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm mt-0.5">Your collection, everywhere — Pro</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="themeToggle" aria-label="Switch theme"
          class="p-4 rounded-full bg-gray-200/80 dark:bg-gray-800 text-gray-700 dark:text-gray-200 shadow-md hover:shadow-xl transition-all active:scale-90 text-xl">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </header>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-5 mb-9">
      <div class="stats-card"><span class="number" id="totalBookmarks">0</span><span class="label">Total</span></div>
      <div class="stats-card"><span class="number" id="workBookmarks">0</span><span class="label">Work</span></div>
      <div class="stats-card"><span class="number" id="personalBookmarks">0</span><span class="label">Personal</span>
      </div>
      <div class="stats-card"><span class="number" id="recentBookmarks">0</span><span class="label">Last 7d</span></div>
    </div>

    <!-- Add / Edit Form -->
    <div class="card rounded-3xl shadow-2xl p-6 md:p-7 mb-9 transition-all border-0">
      <h2 class="text-xl md:text-2xl font-semibold mb-5 flex items-center">
        <i class="fas fa-plus-circle mr-3 text-blue-500 text-2xl"></i>
        <span id="formHeading">✨ Add new bookmark</span>
      </h2>
      <form id="bookmarkForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="title" class="block mb-2 text-sm font-semibold">Title <span
                class="text-red-400">*</span></label>
            <input type="text" id="title" autocomplete="off"
              class="w-full p-4 border-2 rounded-2xl focus:ring-4 focus:ring-blue-300 bg-white dark:bg-gray-800 transition-all text-base"
              placeholder="e.g. GitHub">
          </div>
          <div>
            <label for="url" class="block mb-2 text-sm font-semibold">URL <span class="text-red-400">*</span></label>
            <div class="relative">
              <i class="fas fa-link absolute left-5 top-5 text-gray-400"></i>
              <input type="url" id="url"
                class="w-full p-4 pl-12 border-2 rounded-2xl focus:ring-4 focus:ring-blue-300 dark:bg-gray-800 transition-all text-base"
                placeholder="https://example.com">
            </div>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label for="category" class="block mb-2 text-sm font-semibold">Category</label>
            <select id="category"
              class="w-full p-4 border-2 rounded-2xl bg-white dark:bg-gray-800 focus:ring-4 appearance-none category-filter-el text-base">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="learning">Learning</option>
              <option value="entertainment">Entertainment</option>
            </select>
          </div>
          <div>
            <label for="description" class="block mb-2 text-sm font-semibold">Description (optional)</label>
            <textarea id="description" rows="2"
              class="w-full p-4 border-2 rounded-2xl resize-none focus:ring-4 dark:bg-gray-800 transition-all text-base"
              placeholder="Short note..."></textarea>
          </div>
        </div>
        <input type="hidden" id="bookmarkId">
        <div class="flex justify-end gap-4 items-center">
          <button type="reset" id="cancelBtn"
            class="px-7 py-4 border-2 border-gray-300 dark:border-gray-600 rounded-2xl hidden font-bold hover:bg-gray-100 dark:hover:bg-gray-700 transition-all active:scale-95 text-base">
            <i class="fas fa-times mr-2"></i> Cancel
          </button>
          <button type="submit" id="saveBtn"
            class="px-7 py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white rounded-2xl font-bold flex items-center shadow-xl hover:shadow-2xl transition-all active:scale-95 text-base">
            <i class="fas fa-plus mr-2"></i>
            <span>Add</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Search & Filter & Tools -->
    <div class="card rounded-3xl shadow-2xl p-6 md:p-7 border-0">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5 mb-7">
        <h2 class="text-2xl font-bold flex items-center">
          <i class="fas fa-bookmark mr-3 text-blue-500"></i> Your bookmarks
        </h2>
        <div class="flex flex-col sm:flex-row w-full sm:w-auto gap-4">
          <div class="relative flex-1 min-w-0">
            <i class="fas fa-search absolute left-5 top-5 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Search (Ctrl+K or /)"
              class="w-full p-4 pl-12 border-2 rounded-2xl focus:ring-4 dark:bg-gray-800 transition-all text-base">
          </div>
          <select id="categoryFilter"
            class="p-4 border-2 rounded-2xl bg-white dark:bg-gray-800 focus:ring-4 appearance-none category-filter-el w-full sm:w-auto text-base">
            <option value="all">All categories</option>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="learning">Learning</option>
            <option value="entertainment">Entertainment</option>
          </select>
        </div>
      </div>

      <!-- Tool buttons -->
      <div class="flex flex-wrap gap-3 mb-6">
        <button id="exportBtn"
          class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-semibold shadow-lg transition-all active:scale-95">
          <i class="fas fa-download mr-2"></i> Export
        </button>
        <button id="importBtn"
          class="px-5 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-2xl font-semibold shadow-lg transition-all active:scale-95">
          <i class="fas fa-upload mr-2"></i> Import
        </button>
        <button id="clearAllBtn"
          class="px-5 py-3 bg-red-500 hover:bg-red-600 text-white rounded-2xl font-semibold shadow-lg transition-all active:scale-95">
          <i class="fas fa-trash-can mr-2"></i> Clear All
        </button>
        <input type="file" id="importFileInput" accept=".json" class="hidden">
      </div>

      <!-- Bookmark list -->
      <div id="bookmarksList" class="space-y-3 min-h-[240px]">
        <!-- rendered by JS -->
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="floating-action-btn" id="addBookmarkBtn" aria-label="Add bookmark">
    <i class="fas fa-plus"></i>
  </button>

  <!-- Toast -->
  <div id="toast" class="toast">
    <i id="toastIcon" class="fas fa-check-circle text-green-500 text-xl"></i>
    <span id="toastMessage">Bookmark saved</span>
    <button id="toastUndoBtn" class="undo-btn hidden">Undo</button>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
